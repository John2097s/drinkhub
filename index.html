<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GameNight DrinkHub</title>

  <!-- Lokale Bibliotheken (100% Offline-Ready für Android APK) -->
  <script src="js/tailwind.js"></script>
  <script src="js/lucide.js"></script>
  <script src="js/peerjs.min.js"></script>
  <script src="js/confetti.min.js"></script>

  <!-- Fallback-CDN für Vorschau & Browser, falls lokale Dateien nicht geladen wurden -->
  <script>
    if (typeof tailwind === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.tailwindcss.com';
      document.head.appendChild(s);
    }
    if (typeof lucide === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/lucide@latest';
      s.onload = () => { if (typeof safeCreateIcons === 'function') safeCreateIcons(); };
      document.head.appendChild(s);
    }
    if (typeof Peer === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      document.head.appendChild(s);
    }
    if (typeof confetti === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
      document.head.appendChild(s);
    }
  </script>

  <!-- Google Fonts: Inter & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Rajdhani', 'sans-serif'],
            },
            colors: {
              neon: {
                purple: '#a855f7',
                cyan: '#06b6d4',
                pink: '#ec4899',
                emerald: '#10b981',
                amber: '#f59e0b',
                red: '#ef4444'
              }
            }
          }
        }
      };
    }
  </script>

  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    button, select, input {
      touch-action: manipulation;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-card {
      background: rgba(24, 24, 27, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stickerPulse {
      0%, 100% { transform: rotate(8deg) scale(1); }
      50% { transform: rotate(11deg) scale(1.06); }
    }
    .sticker-badge {
      animation: stickerPulse 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col selection:bg-purple-500 selection:text-white text-sm sm:text-base">

  <!-- Ambient Background Glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-24 -left-24 w-72 h-72 bg-purple-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 w-80 h-80 bg-cyan-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/4 w-72 h-72 bg-pink-600/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-30 glass-card border-b border-zinc-800/80 px-3 sm:px-4 py-2.5 sm:py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 cursor-pointer min-w-0" onclick="goHome()">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-purple-600 via-pink-600 to-cyan-500 p-[1px] shadow-lg shadow-purple-500/20 shrink-0">
          <div class="w-full h-full bg-zinc-950 rounded-[11px] flex items-center justify-center">
            <i data-lucide="gamepad-2" class="w-4 h-4 sm:w-5 sm:h-5 text-purple-400"></i>
          </div>
        </div>
        <div class="truncate">
          <h1 class="font-display font-bold text-lg sm:text-xl tracking-wider uppercase leading-none bg-gradient-to-r from-white via-purple-200 to-cyan-200 bg-clip-text text-transparent">
            DrinkHub
          </h1>
          <p class="text-[9px] sm:text-[10px] text-zinc-400 font-medium tracking-widest uppercase">Friends Edition</p>
        </div>
      </div>

      <!-- Lobby & Squad Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="btn-open-lobby" onclick="toggleLobbyModal(true)" class="flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 px-2.5 sm:px-3 py-2 min-h-[40px] rounded-xl text-xs font-semibold transition active:scale-95">
          <span id="lobby-status-dot" class="w-2 h-2 rounded-full bg-zinc-500 shrink-0"></span>
          <span id="lobby-btn-text" class="text-zinc-200 truncate max-w-[95px] sm:max-w-none">Lobby</span>
        </button>

        <button onclick="togglePlayerModal(true)" class="flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 px-2.5 sm:px-3 py-2 min-h-[40px] rounded-xl text-xs font-semibold transition active:scale-95">
          <i data-lucide="users" class="w-4 h-4 text-cyan-400 shrink-0"></i>
          <span id="player-count-badge" class="text-zinc-200">0</span>
        </button>

        <button onclick="openProfileView()" class="flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 px-2.5 sm:px-3 py-2 min-h-[40px] rounded-xl text-xs font-semibold transition active:scale-95" title="Profil & Archiv">
          <i data-lucide="user-check" class="w-4 h-4 text-purple-400 shrink-0"></i>
          <span class="hidden sm:inline text-zinc-200">Profil</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-container" class="relative z-10 flex-1 max-w-3xl w-full mx-auto px-3 sm:px-4 pt-3 sm:pt-4 pb-24">
    <!-- Wird dynamisch per JS gerendert -->
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-4 w-[90%] max-w-sm">
    <div id="toast-inner" class="bg-zinc-900/95 border border-purple-500/50 text-white px-4 py-3 rounded-2xl shadow-2xl shadow-purple-950/60 flex items-center gap-3 backdrop-blur-md">
      <div class="w-8 h-8 rounded-xl bg-purple-500/20 flex items-center justify-center shrink-0">
        <i data-lucide="beer" class="w-4 h-4 text-purple-400"></i>
      </div>
      <p id="toast-message" class="text-xs font-medium leading-snug"></p>
    </div>
  </div>

  <!-- P2P Lobby Modal -->
  <div id="lobby-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4">
    <div class="glass-card w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-zinc-800 p-5 animate-pop max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="radio" class="w-5 h-5 text-purple-400"></i>
          <h2 class="font-display font-bold text-xl uppercase tracking-wide">Multiplayer Lobby</h2>
        </div>
        <button onclick="toggleLobbyModal(false)" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="lobby-modal-body" class="space-y-4 overflow-y-auto no-scrollbar pr-1">
        <!-- Dynamisch per JS -->
      </div>
    </div>
  </div>

  <!-- Squad / Player Drawer Modal -->
  <div id="player-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4">
    <div class="glass-card w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-zinc-800 p-5 animate-pop max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="trophy" class="w-5 h-5 text-amber-400"></i>
          <h2 class="font-display font-bold text-xl uppercase tracking-wide">Squad & Pegel-Tracker</h2>
        </div>
        <button onclick="togglePlayerModal(false)" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Add Player Form -->
      <form onsubmit="addPlayer(event)" class="flex gap-2 mb-4">
        <input
          type="text"
          id="new-player-input"
          placeholder="Spielername eingeben..."
          maxlength="18"
          class="flex-1 bg-zinc-900/90 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500"
        />
        <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition active:scale-95 flex items-center gap-1">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Add</span>
        </button>
      </form>

      <!-- Players List -->
      <div id="players-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1 no-scrollbar">
        <!-- Dynamisch -->
      </div>

      <!-- Footer Actions -->
      <div class="mt-4 pt-3 border-t border-zinc-800 flex justify-between items-center">
        <button onclick="resetAllDrinks()" class="text-xs text-rose-400 hover:text-rose-300 font-medium flex items-center gap-1.5 py-1.5 px-2 rounded-lg hover:bg-rose-500/10 transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          Alle Schlucke auf 0
        </button>
        <button onclick="togglePlayerModal(false)" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
          Fertig
        </button>
      </div>
    </div>
  </div>

  <!-- Application Logic & Game Database -->
  <script>
    // =========================================================================
    // 1. DEAD BY DAYLIGHT DATENBANK (KILLER BIS 2026 & ALLE EXHAUSTION PERKS)
    // =========================================================================
    const DBD_KILLERS = [
      "The Trapper (Fallensteller)",
      "The Wraith (Geist)",
      "The Hillbilly (Hinterwäldler)",
      "The Nurse (Krankenschwester)",
      "The Shape (Michael Myers)",
      "The Hag (Hexe)",
      "The Doctor (Doktor)",
      "The Huntress (Jägerin)",
      "The Cannibal (Leatherface)",
      "The Nightmare (Freddy Krueger)",
      "The Pig (Das Schwein)",
      "The Clown (Clown)",
      "The Spirit (Gespenst)",
      "The Legion (Legion)",
      "The Plague (Seuche)",
      "The Ghost Face (Ghostface)",
      "The Demogorgon (Demogorgon)",
      "The Oni (Oni)",
      "The Deathslinger (Todesbote)",
      "The Executioner (Pyramid Head)",
      "The Blight (Fäule)",
      "The Twins (Zwillinge)",
      "The Trickster (Trickster)",
      "The Nemesis (Nemesis)",
      "The Cenobite (Pinhead)",
      "The Artist (Künstlerin)",
      "The Onryō (Sadako)",
      "The Dredge (Dredge)",
      "The Mastermind (Albert Wesker)",
      "The Knight (Ritter)",
      "The Skull Merchant (Schädelhändlerin)",
      "The Singularity (Singularität)",
      "The Xenomorph (Xenomorph)",
      "The Good Guy (Chucky)",
      "The Unknown (Das Unbekannte)",
      "The Lich (Vecna)",
      "The Dark Lord (Dracula)",
      "The Houndmaster (Hundemeisterin)",
      "The Ghoul (Ken Kaneki)",
      "The Animatronic (Springtrap)",
      "The Krasue (Krasue)",
      "The Judgement"
    ];

    const DBD_EXHAUSTION_PERKS = [
      { id: "none", name: "Kein Exhaustion Perk" },
      { id: "dead_hard", name: "Dead Hard (Hart im Nehmen)" },
      { id: "lithe", name: "Lithe (Geschmeidig)" },
      { id: "balanced_landing", name: "Balanced Landing (Ausgewogene Landung)" },
      { id: "sprint_burst", name: "Sprint Burst (Sprintbooster)" },
      { id: "head_on", name: "Head On (Frontal)" },
      { id: "overcome", name: "Overcome (Überwinden)" },
      { id: "smash_hit", name: "Smash Hit (Volltreffer)" },
      { id: "background_player", name: "Background Player (Hintergrundspieler)" },
      { id: "dramaturgy", name: "Dramaturgy (Dramaturgie)" }
    ];

    const DBD_MAPS = [
      "MacMillan Estate",
      "Autohaven Wreckers",
      "Coldwind Farm",
      "Crotus Prenn Asylum",
      "Backwater Swamp",
      "Léry's Memorial Institute",
      "Red Forest",
      "Springwood",
      "Gideon Meat Plant",
      "Yamaoka Estate",
      "Ormond",
      "Hawkins National Laboratory",
      "Grave of Glenvale",
      "Silent Hill",
      "Raccoon City",
      "Forsaken Boneyard",
      "Withered Isle",
      "The Decimated Borgo",
      "Dvarka Deepwood",
      "Sleepless District"
    ];

    // =========================================================================
    // 2. MODULARES SPIELE-REGISTRY (AKTUELL NUR DBD FOKUSSIERTER HUB)
    // =========================================================================
    // Andere Spiele sind vorerst für maximale Performance entfernt und können
    // über `registerGameModule(...)` später problemlos ergänzt werden.
    const GAME_MODULES = [
      {
        id: 'dead-by-daylight',
        title: 'Dead by Daylight',
        subtitle: 'Survivor, Killer & Zuschauer-Wetten + Live Tracker',
        genre: 'horror',
        badge: 'Aktiv',
        accent: 'from-rose-700 to-zinc-900',
        borderAccent: 'border-rose-500/50',
        icon: 'skull',
        isCustomDbd: true
      }
    ];

    function registerGameModule(moduleDef) {
      if (!moduleDef || !moduleDef.id) return;
      const idx = GAME_MODULES.findIndex(m => m.id === moduleDef.id);
      if (idx >= 0) GAME_MODULES[idx] = moduleDef;
      else GAME_MODULES.push(moduleDef);
    }

    // =========================================================================
    // 3. APP STATE, PROFIL-ARCHIV & PERSISTENCE
    // =========================================================================
    let state = {
      view: 'hub',
      selectedGameId: null,
      hasSetInitialName: false,
      players: [],
      profileArchive: [],
      lobby: {
        role: 'offline',
        code: '',
        peer: null,
        conns: [],
        hostConn: null,
        myPlayerId: '',
        myName: ''
      },
      dbd: {
        phase: 'role',
        mode: 'survivor',
        killerSubMode: 'solo',
        killerPlayerIndex: 0,
        activePredictPlayerIndex: 0,
        activeTargetStep: 0,
        activeLivePlayerId: '',
        predictions: {},
        readyPlayers: {},
        liveStats: {
          byPlayer: {},
          gensRepaired: 0,
          survivorsHooked: 0,
          survivorsKilled: 0,
          killerStunnedBlinded: 0,
          survivorsEscaped: 0
        },
        actualOutcome: {
          killer: DBD_KILLERS[0],
          map: DBD_MAPS[0],
          exhaustionPerk: DBD_EXHAUSTION_PERKS[0].id
        },
        reviewReadyPlayers: {},
        results: []
      }
    };

    try {
      const savedNameFlag = localStorage.getItem('drinkhub_has_name');
      const savedPlayers = localStorage.getItem('drinkhub_players');
      if (savedPlayers) {
        const parsed = JSON.parse(savedPlayers);
        if (Array.isArray(parsed) && parsed.length > 0 && savedNameFlag === '1') {
          state.players = parsed;
          state.hasSetInitialName = true;
          state.lobby.myPlayerId = parsed[0].id;
          state.lobby.myName = parsed[0].name;
          state.dbd.activeLivePlayerId = parsed[0].id;
        }
      }
      const savedArchive = localStorage.getItem('drinkhub_profile_archive');
      if (savedArchive) {
        const parsedArchive = JSON.parse(savedArchive);
        if (Array.isArray(parsedArchive)) {
          state.profileArchive = parsedArchive;
        }
      }
    } catch (e) {
      console.warn('LocalStorage nicht verfügbar:', e);
    }

    function saveArchive() {
      try {
        localStorage.setItem('drinkhub_profile_archive', JSON.stringify(state.profileArchive.slice(0, 50)));
      } catch (e) {}
    }

    function setInitialPlayerName(e) {
      e.preventDefault();
      const input = document.getElementById('initial-name-input');
      const name = input ? input.value.trim() : '';
      if (!name) {
        showToast('Bitte gib zuerst deinen Namen ein!');
        return;
      }
      const id = 'p-' + Date.now();
      state.players = [{ id, name, sips: 0 }];
      state.hasSetInitialName = true;
      state.lobby.myPlayerId = id;
      state.lobby.myName = name;
      state.dbd.activeLivePlayerId = id;
      try {
        localStorage.setItem('drinkhub_has_name', '1');
      } catch (err) {}
      savePlayers();
      triggerRumble('medium');
      showToast(`Willkommen, ${name}!`);
      render();
    }

    function savePlayers() {
      try {
        localStorage.setItem('drinkhub_players', JSON.stringify(state.players));
      } catch (e) {}
      updatePlayerBadge();
      if (state.lobby.role === 'host') {
        broadcastState();
      }
    }

    function toggleLobbyModal(show) {
      const modal = document.getElementById('lobby-modal');
      if (!modal) return;
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderLobbyModal();
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function copyLobbyCode(code) {
      if (!code) return;
      try {
        const tmp = document.createElement('textarea');
        tmp.value = String(code);
        tmp.setAttribute('readonly', '');
        tmp.style.position = 'fixed';
        tmp.style.opacity = '0';
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand('copy');
        document.body.removeChild(tmp);
        triggerRumble('light', false);
        showToast(`Lobby-Code #${code} kopiert!`);
      } catch (e) {
        showToast(`Lobby-Code: #${code}`);
      }
    }

    function renderLobbyModal() {
      const body = document.getElementById('lobby-modal-body');
      if (!body) return;

      const myName = state.lobby.myName || state.players[0]?.name || 'Spieler';

      if (state.lobby.role === 'host') {
        body.innerHTML = `
          <div class="bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Host aktiv</span>
              <span class="text-xs font-semibold text-zinc-300">${state.players.length}/4 Spieler</span>
            </div>

            <div class="flex items-center justify-between bg-zinc-950/90 border border-zinc-800 rounded-2xl px-4 py-3">
              <div>
                <span class="block text-[10px] uppercase tracking-wider text-zinc-400">Lobby-Code</span>
                <span class="font-display font-bold text-3xl tracking-widest text-white">#${state.lobby.code}</span>
              </div>
              <button
                onclick="copyLobbyCode('${state.lobby.code}')"
                class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center gap-1.5"
              >
                <i data-lucide="copy" class="w-4 h-4 text-cyan-400"></i>
                <span>Kopieren</span>
              </button>
            </div>

            <div class="space-y-1.5">
              <p class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Verbundenes Squad</p>
              ${state.players.map((p, idx) => `
                <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-2 text-xs">
                  <span class="font-semibold text-white">${p.name}</span>
                  <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${idx === 0 ? 'bg-purple-500/20 text-purple-300' : 'bg-cyan-500/20 text-cyan-300'}">
                    ${idx === 0 ? 'Host' : 'Client'}
                  </span>
                </div>
              `).join('')}
            </div>

            <button
              onclick="disconnectLobby(false)"
              class="w-full py-3 rounded-2xl bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-300 font-bold text-xs uppercase tracking-wider transition active:scale-95"
            >
              Lobby schließen
            </button>
          </div>
        `;
        safeCreateIcons();
        return;
      }

      if (state.lobby.role === 'client') {
        body.innerHTML = `
          <div class="bg-cyan-950/40 border border-cyan-500/40 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold uppercase tracking-wider text-cyan-400">Verbunden mit Host</span>
              <span class="font-display font-bold text-xl text-white">#${state.lobby.code}</span>
            </div>

            <div class="space-y-1.5">
              <p class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Spieler in der Lobby</p>
              ${state.players.map((p, idx) => `
                <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-2 text-xs">
                  <span class="font-semibold text-white">${p.name}</span>
                  <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${idx === 0 ? 'bg-purple-500/20 text-purple-300' : 'bg-zinc-800 text-zinc-300'}">
                    ${idx === 0 ? 'Host' : 'Spieler'}
                  </span>
                </div>
              `).join('')}
            </div>

            <button
              onclick="disconnectLobby(false)"
              class="w-full py-3 rounded-2xl bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-300 font-bold text-xs uppercase tracking-wider transition active:scale-95"
            >
              Lobby verlassen
            </button>
          </div>
        `;
        safeCreateIcons();
        return;
      }

      body.innerHTML = `
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">Dein Name</label>
            <input

              value="${myName}"
              maxlength="18"
              placeholder="Spielername..."
              class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500"
            />
          </div>

          <div class="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Neue Lobby starten</span>
              <span class="text-[10px] text-zinc-400">Max. 4 Spieler</span>
            </div>
            <p class="text-xs text-zinc-400">Erstelle einen 4-stelligen Code für deine Freunde.</p>
            <button
              onclick="hostLobby()"
              class="w-full py-3 rounded-2xl bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white font-display font-bold text-sm uppercase tracking-wider shadow-lg transition active:scale-95"
            >
              Lobby hosten
            </button>
          </div>

          <div class="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 space-y-2.5">
            <span class="block text-xs font-bold uppercase tracking-wider text-cyan-400">Lobby beitreten</span>
            <div class="flex gap-2">
              <input
                type="tel"
                id="join-lobby-code"
                inputmode="numeric"
                maxlength="4"
                placeholder="4-stelliger Code"
                class="flex-1 bg-zinc-950 border border-zinc-700 rounded-2xl px-3.5 py-2.5 text-sm text-white tracking-widest placeholder-zinc-500 focus:outline-none focus:border-cyan-500"
              />
              <button
                onclick="joinLobby()"
                class="px-5 py-2.5 rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs uppercase tracking-wider transition active:scale-95"

        </div>

      safeCreateIcons();
    }

    function updatePlayerBadge() {
      const badge = document.getElementById('player-count-badge');
      if (badge) {
        badge.textContent = `${state.players.length}`;
      }
    }

    function triggerRumble(pattern = [120, 60, 180]) {
      try {
        if (typeof navigator !== 'undefined') {
          const vibFn = navigator.vibrate || navigator.webkitVibrate || navigator.mozVibrate;
          if (typeof vibFn === 'function') {
            const normalizedPattern = Array.isArray(pattern)
              ? pattern.map(ms => Math.max(20, Number(ms) || 50))
              : [Math.max(40, Number(pattern) || 120)];
            vibFn.call(navigator, normalizedPattern);
          }
        }
      } catch (e) {}
    }

    function triggerVictoryConfetti() {
      triggerRumble([100, 50, 100, 50, 250]);
      try {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 85,
            spread: 70,
            origin: { y: 0.65 },
            colors: ['#a855f7', '#06b6d4', '#ec4899', '#f59e0b', '#10b981']
          });
          setTimeout(() => {
            confetti({
              particleCount: 50,
              angle: 60,
              spread: 55,
              origin: { x: 0, y: 0.7 }
            });
            confetti({
              particleCount: 50,
              angle: 120,
              spread: 55,
              origin: { x: 1, y: 0.7 }
            });
          }, 200);
        }
      } catch (e) {}
    }

    function updateLobbyBadge() {
      const dot = document.getElementById('lobby-status-dot');
      const txt = document.getElementById('lobby-btn-text');
      if (!dot || !txt) return;

      if (state.lobby.role === 'host') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0';
        txt.textContent = `${state.lobby.code} (${state.players.length}/4)`;
      } else if (state.lobby.role === 'client') {
        dot.className = 'w-2 h-2 rounded-full bg-cyan-400 animate-pulse shrink-0';
        txt.textContent = `#${state.lobby.code}`;
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-zinc-500 shrink-0';
        txt.textContent = 'Lobby';
      }
    }

    // =========================================================================
    // 4. P2P MULTIPLAYER LOBBY (PEERJS)
    // =========================================================================
    function generateLobbyCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function getPeerIdForLobbyCode(code) {
      return `gndh-lobby-${code}`;
    }

    function getOrCreateLocalPlayerId() {
      if (state.lobby.myPlayerId) return state.lobby.myPlayerId;
      if (state.players.length > 0 && state.players[0].id) {
        state.lobby.myPlayerId = state.players[0].id;
        return state.lobby.myPlayerId;
      }
      const id = 'p-' + Date.now();
      state.lobby.myPlayerId = id;
      return id;
    }

    function hostLobby() {
      try {
        if (typeof Peer === 'undefined') {
          showToast('PeerJS ist nicht geladen. Bitte Verbindung prüfen.');
          return;
        }
        const nameInput = document.getElementById('lobby-player-name');
        const myName = (nameInput && nameInput.value.trim()) || state.lobby.myName || state.players[0]?.name || 'Host';
        const myId = getOrCreateLocalPlayerId();

        state.lobby.myName = myName;
        state.lobby.myPlayerId = myId;

        if (!state.players.some(p => p.id === myId)) {
          state.players.unshift({ id: myId, name: myName, sips: 0 });
        } else {
          const existing = state.players.find(p => p.id === myId);
          if (existing) existing.name = myName;
        }
        savePlayers();

        disconnectLobby(true);

        const code = generateLobbyCode();
        const peer = new Peer(getPeerIdForLobbyCode(code), { debug: 0 });

        state.lobby.role = 'host';
        state.lobby.code = code;
        state.lobby.peer = peer;
        state.lobby.conns = [];
        state.lobby.hostConn = null;
        updateLobbyBadge();
        renderLobbyModal();

        peer.on('open', () => {
          triggerRumble('medium', false);
          showToast(`Lobby #${code} ist bereit!`);
          renderLobbyModal();
        });

        peer.on('connection', (conn) => {
          if (state.players.length >= 4) {
            conn.on('open', () => {
              conn.send({ type: 'LOBBY_FULL' });
              setTimeout(() => conn.close(), 250);
            });
            return;
          }

          state.lobby.conns.push(conn);

          conn.on('data', (data) => {
            handleHostReceivedData(conn, data);
          });

          conn.on('close', () => {
            state.lobby.conns = state.lobby.conns.filter(c => c !== conn);
            if (conn._clientPlayerId) {
              state.players = state.players.filter(p => p.id !== conn._clientPlayerId);
              savePlayers();
              broadcastState();
              render();
              renderLobbyModal();
            }
          });

          conn.on('error', () => {
            state.lobby.conns = state.lobby.conns.filter(c => c !== conn);
          });
        });

        peer.on('error', (err) => {
          console.warn('Host Peer Fehler:', err);
          if (err && err.type === 'unavailable-id') {
            hostLobby();
            return;
          }
          showToast('Lobby konnte nicht erstellt werden.');
        });
      } catch (e) {
        console.warn('hostLobby Fehler:', e);
        showToast('Fehler beim Starten der Lobby.');
      }
    }

    function joinLobby() {
      try {
        if (typeof Peer === 'undefined') {
          showToast('PeerJS ist nicht geladen. Bitte Verbindung prüfen.');
          return;
        }
        const nameInput = document.getElementById('lobby-player-name');
        const codeInput = document.getElementById('join-lobby-code');
        const myName = (nameInput && nameInput.value.trim()) || state.lobby.myName || state.players[0]?.name || 'Spieler';
        const rawCode = (codeInput && codeInput.value.trim()) || '';

        if (!/^\d{4}$/.test(rawCode)) {
          showToast('Bitte einen 4-stelligen Lobby-Code eingeben!');
          return;
        }

        const myId = getOrCreateLocalPlayerId();
        state.lobby.myName = myName;
        state.lobby.myPlayerId = myId;

        disconnectLobby(true);

        const peer = new Peer(undefined, { debug: 0 });
        state.lobby.role = 'client';
        state.lobby.code = rawCode;
        state.lobby.peer = peer;
        state.lobby.conns = [];
        state.lobby.hostConn = null;
        updateLobbyBadge();
        showToast(`Verbinde mit Lobby #${rawCode}...`);

        peer.on('open', () => {
          const conn = peer.connect(getPeerIdForLobbyCode(rawCode), { reliable: true });
          state.lobby.hostConn = conn;

          conn.on('open', () => {
            conn.send({
              type: 'JOIN_REQUEST',
              player: { id: myId, name: myName, sips: 0 }
            });
            triggerRumble('light', false);
            renderLobbyModal();
          });

          conn.on('data', (data) => {
            handleClientReceivedData(data);
          });

          conn.on('close', () => {
            showToast('Verbindung zur Lobby getrennt.');
            disconnectLobby(true);
            render();
          });

          conn.on('error', () => {
            showToast('Verbindung zum Host fehlgeschlagen.');
          });
        });

        peer.on('error', (err) => {
          console.warn('Client Peer Fehler:', err);
          showToast('Lobby nicht gefunden oder Verbindung fehlgeschlagen.');
        });
      } catch (e) {
        console.warn('joinLobby Fehler:', e);
        showToast('Fehler beim Beitreten.');
      }
    }

    function disconnectLobby(silent = false) {
      try {
        if (state.lobby.hostConn) {
          state.lobby.hostConn.close();
          state.lobby.hostConn = null;
        }
        if (Array.isArray(state.lobby.conns)) {
          state.lobby.conns.forEach(c => {
            try { c.close(); } catch (err) {}
          });
          state.lobby.conns = [];
        }
        if (state.lobby.peer) {
          state.lobby.peer.destroy();
          state.lobby.peer = null;
        }
      } catch (e) {}

      state.lobby.role = 'offline';
      state.lobby.code = '';
      updateLobbyBadge();
      if (!silent) {
        showToast('Lobby verlassen.');
        renderLobbyModal();
        render();
      }
    }

    function handleHostReceivedData(conn, data) {
      if (!data || typeof data !== 'object') return;

      if (data.type === 'JOIN_REQUEST' && data.player) {
        if (state.players.length >= 4) {
          conn.send({ type: 'LOBBY_FULL' });
          return;
        }
        const incomingId = data.player.id || ('p-' + Date.now());
        const incomingName = String(data.player.name || 'Spieler').trim().slice(0, 18) || 'Spieler';
        conn._clientPlayerId = incomingId;

        const existing = state.players.find(p => p.id === incomingId);
        if (existing) {
          existing.name = incomingName;
        } else {
          state.players.push({ id: incomingId, name: incomingName, sips: Number(data.player.sips) || 0 });
        }
        ensureDbdPlayerStats(incomingId);
        savePlayers();
        broadcastState();
        render();
        renderLobbyModal();
        showToast(`${incomingName} ist beigetreten!`);
      } else if (data.type === 'DBD_PREDICTION') {
        if (!data.playerId || !data.targetId || !data.prediction) return;
        if (!state.dbd.predictions[data.playerId]) state.dbd.predictions[data.playerId] = {};
        state.dbd.predictions[data.playerId][data.targetId] = data.prediction;
        broadcastState();
      } else if (data.type === 'DBD_READY') {
        if (!data.playerId) return;
        state.dbd.readyPlayers[data.playerId] = Boolean(data.ready);
        if (areAllDbdPlayersReady() && state.dbd.phase === 'predict') {
          startDbdLiveRound();
        } else {
          broadcastState();
          render();
        }
      } else if (data.type === 'DBD_LIVE_ACTION') {
        applyDbdLiveAction(data.action, data.targetPlayerId, true);
      } else if (data.type === 'DBD_REVIEW_READY') {
        if (!data.playerId) return;
        state.dbd.reviewReadyPlayers[data.playerId] = true;
        if (areAllDbdPlayersReviewReady() && state.dbd.phase === 'review') {
          evaluateDbdMatch();
        } else {
          broadcastState();
          render();
        }
      } else if (data.type === 'DBD_NEW_ROUND') {
        startSameModeNewRound(true);
      }
    }

    function handleClientReceivedData(data) {
      if (!data || typeof data !== 'object') return;

      if (data.type === 'LOBBY_FULL') {
        showToast('Lobby ist bereits voll (max. 4 Spieler).');
        disconnectLobby(true);
        renderLobbyModal();
        return;
      }

      if (data.type === 'STATE_SYNC' && data.payload) {
        const p = data.payload;
        if (Array.isArray(p.players)) state.players = p.players;
        if (p.view) state.view = p.view;
        if (p.selectedGameId !== undefined) state.selectedGameId = p.selectedGameId;
        if (p.dbd) state.dbd = p.dbd;
        updatePlayerBadge();
        updateLobbyBadge();
        render();
        const lobbyModal = document.getElementById('lobby-modal');
        if (lobbyModal && !lobbyModal.classList.contains('hidden')) {
          renderLobbyModal();
        }
      }
    }

    function broadcastState() {
      if (state.lobby.role !== 'host' || !Array.isArray(state.lobby.conns)) return;
      const payload = {
        players: state.players,
        view: state.view,
        selectedGameId: state.selectedGameId,
        dbd: state.dbd
      };
      state.lobby.conns.forEach(conn => {
        try {
          if (conn && conn.open) {
            conn.send({ type: 'STATE_SYNC', payload });
          }
        } catch (e) {}
      });
    }

    function areAllDbdPlayersReady() {
      const participants = getDbdParticipants();
      if (participants.length === 0) return false;
      return participants.every(p => Boolean(state.dbd.readyPlayers[p.id]));
    }

    function areAllDbdPlayersReviewReady() {
      const participants = getDbdParticipants();
      if (participants.length === 0) return false;
      return participants.every(p => Boolean(state.dbd.reviewReadyPlayers[p.id]));
    }

    // =========================================================================
    // 5. NAVIGATION, PROFIL-ARCHIV & SQUAD-VERWALTUNG
    // =========================================================================
    let selectedArchiveEntryId = null;

    function goHome() {
      state.view = 'hub';
      state.selectedGameId = null;
      selectedArchiveEntryId = null;
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function openProfileView() {
      state.view = 'profile';
      selectedArchiveEntryId = null;
      render();
    }

    function toggleArchiveEntry(entryId) {
      selectedArchiveEntryId = selectedArchiveEntryId === entryId ? null : entryId;
      render();
    }

    function openGameOrFranchise(id) {
      const item = GAME_MODULES.find(g => g.id === id);
      if (!item) return;

      if (item.isFranchise) {
        state.view = 'franchise';
        state.selectedFranchiseId = item.id;
      } else {
        state.view = 'game';
        state.selectedGameId = item.id;
        state.activeTab = 'rules';
        state.currentCard = null;
        if (item.isCustomDbd) {
          resetDbdMatch('role');
        }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function openSubGame(franchiseId, subGameId) {
      state.view = 'game';
      state.selectedFranchiseId = franchiseId;
      state.selectedGameId = subGameId;
      state.activeTab = 'rules';
      state.currentCard = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function getActiveGame() {
      if (state.selectedFranchiseId) {
        const franchise = GAMES_DB.find(g => g.id === state.selectedFranchiseId);
        if (franchise) {
          return franchise.subGames.find(s => s.id === state.selectedGameId);
        }
      }
      return GAMES_DB.find(g => g.id === state.selectedGameId);
    }

    function togglePlayerModal(show) {
      const modal = document.getElementById('player-modal');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderPlayersList();
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function addPlayer(e) {
      e.preventDefault();
      const input = document.getElementById('new-player-input');
      const name = input.value.trim();
      if (!name) return;

      const newId = 'p-' + Date.now();
      state.players.push({ id: newId, name, sips: 0 });
      input.value = '';
      savePlayers();
      renderPlayersList();
      render();
      showToast(`${name} ist dem Squad beigetreten!`);
    }

    function removePlayer(id) {
      if (state.players.length <= 1) {
        showToast('Mindestens 1 Spieler muss im Squad bleiben!');
        return;
      }
      state.players = state.players.filter(p => p.id !== id);
      if (state.dbd.activeLivePlayerId === id) {
        state.dbd.activeLivePlayerId = state.players[0].id;
      }
      savePlayers();
      renderPlayersList();
      render();
    }

    function adjustPlayerSips(id, delta) {
      const player = state.players.find(p => p.id === id);
      if (!player) return;
      player.sips = Math.max(0, player.sips + delta);
      savePlayers();
      renderPlayersList();
    }

    function resetAllDrinks() {
      state.players.forEach(p => p.sips = 0);
      savePlayers();
      renderPlayersList();
      showToast('Alle Schlucke wurden auf 0 zurückgesetzt.');
    }

    function renderPlayersList() {
      const container = document.getElementById('players-list');
      if (!container) return;

      container.innerHTML = state.players.map((p, idx) => `
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-white truncate">${p.name}</span>
              ${idx === 0 ? '<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">Du / Host</span>' : ''}
            </div>
            <p class="text-xs text-amber-400 font-semibold mt-0.5">${p.sips} ${p.sips === 1 ? 'Schluck' : 'Schlucke'}</p>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="adjustPlayerSips('${p.id}', -1)" class="w-8 h-8 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-sm active:scale-90">-</button>
            <button onclick="adjustPlayerSips('${p.id}', 1)" class="w-8 h-8 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-90">+</button>
            ${state.players.length > 1 ? `
              <button onclick="removePlayer('${p.id}')" class="w-8 h-8 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 flex items-center justify-center active:scale-90" title="Entfernen">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
      safeCreateIcons();
    }

    function ensureDbdPlayerStats(playerId) {
      if (!playerId) {
        return { missedChecks: 0, hooks: 0, stunsBlinds: 0, healsUnhooks: 0 };
      }
      if (!state.dbd.liveStats) {
        state.dbd.liveStats = {
          byPlayer: {},
          gensRepaired: 0,
          survivorsHooked: 0,
          survivorsKilled: 0,
          killerStunnedBlinded: 0,
          survivorsEscaped: 0
        };
      }
      if (!state.dbd.liveStats.byPlayer) {
        state.dbd.liveStats.byPlayer = {};
      }
      if (!state.dbd.liveStats.byPlayer[playerId]) {
        state.dbd.liveStats.byPlayer[playerId] = {
          missedChecks: 0,
          hooks: 0,
          stunsBlinds: 0,
          healsUnhooks: 0
        };
      }
      return state.dbd.liveStats.byPlayer[playerId];
    }

    /**
     * Gezielte DOM-Aktualisierung ohne komplettes Neuzeichnen des gesamten Screens,
     * damit beim Eintragen von Stats kein Flackern entsteht.
     */
    function patchLiveCounterText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = String(value);
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      if (!toast || !msgEl) return;

      msgEl.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2400);
    }

    // =========================================================================
    // 6. DEAD BY DAYLIGHT LOGIK (SURVIVOR, KILLER, ZUSCHAUER & AUSWERTUNG)
    // =========================================================================
    function resetDbdMatch(targetPhase = 'role', rotateKiller = false) {
      const byPlayer = {};
      state.players.forEach(p => {
        byPlayer[p.id] = {
          missedChecks: 0,
          hooks: 0,
          stunsBlinds: 0,
          healsUnhooks: 0
        };
      });

      const nextKillerIndex = rotateKiller && state.players.length > 0
        ? (state.dbd.killerPlayerIndex + 1) % state.players.length
        : (state.dbd.killerPlayerIndex || 0);

      state.dbd = {
        phase: targetPhase,
        mode: state.dbd.mode || 'survivor',
        killerSubMode: state.dbd.killerSubMode || 'solo',
        killerPlayerIndex: nextKillerIndex,
        activePredictPlayerIndex: 0,
        activeTargetStep: 0,
        activeLivePlayerId: state.players[0]?.id || '',
        predictions: {},
        readyPlayers: {},
        liveStats: {
          byPlayer,
          gensRepaired: 0,
          survivorsHooked: 0,
          survivorsKilled: 0,
          killerStunnedBlinded: 0,
          survivorsEscaped: 0
        },
        actualOutcome: {
          killer: DBD_KILLERS[0],
          map: DBD_MAPS[0],
          exhaustionPerk: DBD_EXHAUSTION_PERKS[0].id
        },
        reviewReadyPlayers: {},
        results: []
      };
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    /**
     * Startet eine komplett neue Runde im exakt aktuellen Modus (Survivor / Killer / Zuschauer)
     * und rotiert den Killer nur dann, wenn der aktuelle Modus ein Killer-Modus ist.
     */
    function startSameModeNewRound(fromRemote = false) {
      if (state.lobby.role === 'client' && !fromRemote) {
        state.lobby.hostConn.send({ type: 'DBD_NEW_ROUND' });
        return;
      }

      const currentMode = state.dbd.mode || 'survivor';
      const currentSubMode = state.dbd.killerSubMode || 'solo';
      const shouldRotateKiller = currentMode === 'killer';

      const byPlayer = {};
      state.players.forEach(p => {
        byPlayer[p.id] = {
          missedChecks: 0,
          hooks: 0,
          stunsBlinds: 0,
          healsUnhooks: 0
        };
      });

      const nextKillerIndex = shouldRotateKiller && state.players.length > 0
        ? (state.dbd.killerPlayerIndex + 1) % state.players.length
        : state.dbd.killerPlayerIndex;

      state.dbd = {
        phase: 'predict',
        mode: currentMode,
        killerSubMode: currentSubMode,
        killerPlayerIndex: nextKillerIndex,
        activePredictPlayerIndex: 0,
        activeTargetStep: 0,
        activeLivePlayerId: state.players[0]?.id || '',
        predictions: {},
        readyPlayers: {},
        liveStats: {
          byPlayer,
          gensRepaired: 0,
          survivorsHooked: 0,
          survivorsKilled: 0,
          killerStunnedBlinded: 0,
          survivorsEscaped: 0
        },
        actualOutcome: {
          killer: DBD_KILLERS[0],
          map: DBD_MAPS[0],
          exhaustionPerk: DBD_EXHAUSTION_PERKS[0].id
        },
        reviewReadyPlayers: {},
        results: []
      };

      const participants = getDbdParticipants();
      participants.forEach(p => {
        getPredictionTargetsFor(p.id).forEach(t => getOrCreatePrediction(p.id, t.id));
        ensureDbdPlayerStats(p.id);
      });

      triggerRumble('medium', true);
      if (state.lobby.role === 'host') broadcastState();
      render();
      showToast('Neue Runde gestartet!');
    }

    function getCurrentKillerPlayer() {
      if (state.players.length === 0) return null;
      const idx = state.dbd.killerPlayerIndex % state.players.length;
      return state.players[idx];
    }

    function getPredictionTargetsFor(predictorId) {
      const isMultiplayer = state.lobby.role !== 'offline' || state.players.length > 1;
      if (!isMultiplayer) {
        return state.players.filter(p => p.id === predictorId);
      }
      if (state.dbd.mode === 'killer' && state.dbd.killerSubMode === 'spectator') {
        const killerPlayer = getCurrentKillerPlayer();
        return killerPlayer ? [killerPlayer] : state.players.filter(p => p.id !== predictorId);
      }
      return state.players.filter(p => p.id !== predictorId);
    }

    function getOrCreatePrediction(predictorId, targetId) {
      if (!state.dbd.predictions[predictorId]) {
        state.dbd.predictions[predictorId] = {};
      }
      if (!state.dbd.predictions[predictorId][targetId]) {
        state.dbd.predictions[predictorId][targetId] = {
          killer: DBD_KILLERS[0],
          map: DBD_MAPS[0],
          missedChecks: 1,
          hooks: 1,
          escaped: 2,
          gens: 3,
          exhaustionPerk: DBD_EXHAUSTION_PERKS[1].id
        };
      }
      return state.dbd.predictions[predictorId][targetId];
    }

    function selectDbdMode(mode, killerSubMode = 'solo') {
      state.dbd.mode = mode;
      state.dbd.killerSubMode = killerSubMode;
      state.dbd.phase = 'predict';
      state.dbd.activePredictPlayerIndex = 0;
      state.dbd.activeTargetStep = 0;
      state.dbd.readyPlayers = {};
      state.dbd.reviewReadyPlayers = {};

      const participants = getDbdParticipants();
      participants.forEach(p => {
        const targets = getPredictionTargetsFor(p.id);
        targets.forEach(t => getOrCreatePrediction(p.id, t.id));
        ensureDbdPlayerStats(p.id);
      });

      triggerRumble('light', true);
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function getDbdParticipants() {
      if (state.dbd.mode === 'killer' && state.dbd.killerSubMode === 'solo') {
        if (state.lobby.role === 'client') {
          const me = state.players.find(p => p.id === state.lobby.myPlayerId);
          return me ? [me] : [];
        }
        return state.players.length > 0 ? [state.players[0]] : [];
      }
      return state.players;
    }

    function updateDbdPredictionField(predictorId, targetId, field, value) {
      const pred = getOrCreatePrediction(predictorId, targetId);
      pred[field] = value;

      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_PREDICTION',
          playerId: predictorId,
          targetId,
          prediction: pred
        });
      } else if (state.lobby.role === 'host') {
        broadcastState();
      }
      render();
    }

    /**
     * Step-by-Step Tipp-Flow: erst nacheinander jeden Ziel-Spieler abarbeiten,
     * danach erst als "Bereit" markieren. Bei 3+ Spielern im Offline-Modus öffnet sich
     * danach das nächste Spieler-Pop-Up / Step für den nächsten Spieler.
     */
    function advancePredictionOrReady(predictorId, totalTargets) {
      const nextStep = (state.dbd.activeTargetStep || 0) + 1;
      if (nextStep < totalTargets) {
        state.dbd.activeTargetStep = nextStep;
        triggerRumble('light', false);
        render();
        return;
      }

      state.dbd.readyPlayers[predictorId] = true;
      state.dbd.activeTargetStep = 0;
      triggerRumble('medium', true);

      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_READY',
          playerId: predictorId,
          ready: true
        });
        render();
        return;
      }

      if (state.lobby.role === 'host') {
        if (areAllDbdPlayersReady()) {
          startDbdLiveRound();
        } else {
          broadcastState();
          render();
        }
        return;
      }

      const participants = getDbdParticipants();
      if (state.dbd.activePredictPlayerIndex < participants.length - 1) {
        state.dbd.activePredictPlayerIndex++;
        state.dbd.activeTargetStep = 0;
        showToast(`Jetzt tippt ${participants[state.dbd.activePredictPlayerIndex].name}!`);
        render();
      } else {
        startDbdLiveRound();
      }
    }

    function startDbdLiveRound() {
      state.dbd.phase = 'live';
      const killerPlayer = getCurrentKillerPlayer();
      state.dbd.activeLivePlayerId = (state.dbd.mode === 'killer' && killerPlayer)
        ? killerPlayer.id
        : (state.players[0]?.id || '');
      state.players.forEach(p => ensureDbdPlayerStats(p.id));
      triggerRumble('medium', true);
      if (state.lobby.role === 'host') broadcastState();
      render();
      showToast('Alle bereit! Runde gestartet!');
    }

    function setActiveLivePlayer(playerId) {
      if (state.lobby.role !== 'offline') return;
      state.dbd.activeLivePlayerId = playerId;
      ensureDbdPlayerStats(playerId);
      render();
    }

    function triggerDbdLiveEvent(action, explicitTargetPlayerId = null) {
      const targetId = explicitTargetPlayerId || (
        state.lobby.role === 'client'
          ? state.lobby.myPlayerId
          : state.dbd.activeLivePlayerId
      );

      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_LIVE_ACTION',
          action,
          targetPlayerId: targetId
        });
        return;
      }
      applyDbdLiveAction(action, targetId, false);
    }

    function applyDbdLiveAction(action, targetPlayerId, fromRemote) {
      const s = state.dbd.liveStats;
      const pStats = ensureDbdPlayerStats(targetPlayerId);
      const targetPlayer = state.players.find(p => p.id === targetPlayerId);
      const pName = targetPlayer ? targetPlayer.name : 'Spieler';

      if (state.dbd.mode === 'survivor') {
        if (action === 'missedCheck') {
          pStats.missedChecks++;
          triggerRumble('medium', !fromRemote);
          patchLiveCounterText('live-count-missed', pStats.missedChecks);
          if (!fromRemote) showToast(`${pName}: Skillcheck verfehlt (+1 Shot)`);
        } else if (action === 'hook') {
          if (pStats.hooks >= 3) {
            if (!fromRemote) showToast(`${pName} ist bereits bei 3/3 Haken (Tot)!`);
            return;
          }
          pStats.hooks++;
          patchLiveCounterText('live-count-hooks', `${pStats.hooks}/3`);
          if (pStats.hooks === 3) {
            triggerRumble('heavy', !fromRemote);
            if (!fromRemote) showToast(`${pName}: 3. Haken = TOD (+3 Shots)!`);
          } else {
            triggerRumble('medium', !fromRemote);
            if (!fromRemote) showToast(`${pName}: Haken ${pStats.hooks}/3 (+1 Shot)`);
          }
        } else if (action === 'stunBlind') {
          pStats.stunsBlinds++;
          triggerRumble('light', !fromRemote);
          patchLiveCounterText('live-count-stun', pStats.stunsBlinds);
          patchLiveCounterText('live-player-points', (pStats.stunsBlinds + pStats.healsUnhooks) * 10);
          if (!fromRemote) showToast(`${pName}: Killer gestunt/geblendet (+10 Pkt)`);
        } else if (action === 'healUnhook') {
          pStats.healsUnhooks++;
          triggerRumble('light', !fromRemote);
          patchLiveCounterText('live-count-heal', pStats.healsUnhooks);
          patchLiveCounterText('live-player-points', (pStats.stunsBlinds + pStats.healsUnhooks) * 10);
          if (!fromRemote) showToast(`${pName}: Geheilt / Vom Haken gerettet (+10 Pkt)`);
        }
      } else {
        if (action === 'genRepaired') {
          if (s.gensRepaired >= 5) return;
          s.gensRepaired++;
          triggerRumble('medium', !fromRemote);
          patchLiveCounterText('killer-count-gens', `${s.gensRepaired}/5`);
          if (!fromRemote) showToast(`Generator repariert (${s.gensRepaired}/5 -> +1 Shot)`);
        } else if (action === 'survHooked') {
          if (s.survivorsHooked >= 12) return;
          s.survivorsHooked++;
          triggerRumble('light', !fromRemote);
          patchLiveCounterText('killer-count-hooks', s.survivorsHooked);
          if (!fromRemote) showToast('Survivor angehakt (+5 Punkte)');
        } else if (action === 'survKilled') {
          if (s.survivorsKilled >= 4) return;
          s.survivorsKilled++;
          triggerRumble('light', !fromRemote);
          patchLiveCounterText('killer-count-kills', `${s.survivorsKilled}/4`);
          if (!fromRemote) showToast(`Survivor gekillt (${s.survivorsKilled}/4 -> +10 Punkte)`);
        } else if (action === 'killerStunned') {
          s.killerStunnedBlinded++;
          triggerRumble('heavy', !fromRemote);
          patchLiveCounterText('killer-count-stun', s.killerStunnedBlinded);
          if (!fromRemote) showToast('Stun / Blind kassiert (+2 Shots)');
        } else if (action === 'survEscaped') {
          if (s.survivorsEscaped >= 4) return;
          s.survivorsEscaped++;
          triggerRumble('medium', !fromRemote);
          patchLiveCounterText('killer-count-escape', `${s.survivorsEscaped}/4`);
          if (!fromRemote) showToast(`Survivor entkommen (${s.survivorsEscaped}/4 -> +1 Shot)`);
        }
      }

      if (state.lobby.role === 'host') broadcastState();
    }

    function adjustReviewPlayerStat(playerId, field, delta, min = 0, max = 99) {
      const pStats = ensureDbdPlayerStats(playerId);
      const next = (pStats[field] || 0) + delta;
      pStats[field] = Math.max(min, Math.min(max, next));
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function adjustReviewGlobalStat(field, delta, min = 0, max = 99) {
      const next = (state.dbd.liveStats[field] || 0) + delta;
      state.dbd.liveStats[field] = Math.max(min, Math.min(max, next));
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function goToDbdReview() {
      state.dbd.phase = 'review';
      state.dbd.reviewReadyPlayers = {};
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function confirmDbdReviewForPlayer(playerId) {
      state.dbd.reviewReadyPlayers[playerId] = true;
      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_REVIEW_READY',
          playerId
        });
        render();
        return;
      }
      if (state.lobby.role === 'host') {
        if (areAllDbdPlayersReviewReady()) {
          evaluateDbdMatch();
        } else {
          broadcastState();
          render();
        }
        return;
      }
      evaluateDbdMatch();
    }

    /**
     * Berechnet Punkte und Shots.
     * Wenn eine Vorhersage (Skillchecks / Haken / Entkommene / Gens) exakt richtig geraten wurde,
     * werden die dafür gewetteten Shots vom Shot-Counter abgezogen (man muss dafür nicht trinken).
     */
    function evaluateDbdMatch() {
      const s = state.dbd.liveStats;
      const actual = state.dbd.actualOutcome;
      const participants = getDbdParticipants();
      const isMultiplayer = state.lobby.role !== 'offline' || state.players.length > 1;
      const distributedShots = {};

      const results = participants.map(player => {
        const pStats = ensureDbdPlayerStats(player.id);
        let points = 0;
        let shots = 0;
        const breakdown = [];
        const targets = getPredictionTargetsFor(player.id);

        if (state.dbd.mode === 'survivor') {
          shots += pStats.missedChecks * 1;
          if (pStats.missedChecks > 0) breakdown.push(`${pStats.missedChecks}x Skillcheck verfehlt (+${pStats.missedChecks} Shots)`);

          let hookShots = 0;
          if (pStats.hooks === 1) hookShots = 1;
          else if (pStats.hooks === 2) hookShots = 2;
          else if (pStats.hooks >= 3) hookShots = 5;
          shots += hookShots;
          if (pStats.hooks > 0) breakdown.push(`${pStats.hooks}/3 Haken (+${hookShots} Shots)`);

          points += pStats.stunsBlinds * 10;
          if (pStats.stunsBlinds > 0) breakdown.push(`${pStats.stunsBlinds}x Stun/Blind (+${pStats.stunsBlinds * 10} Pkt)`);

          points += pStats.healsUnhooks * 10;
          if (pStats.healsUnhooks > 0) breakdown.push(`${pStats.healsUnhooks}x Heal/Unhook (+${pStats.healsUnhooks * 10} Pkt)`);

          targets.forEach(target => {
            const pred = getOrCreatePrediction(player.id, target.id);
            const tStats = ensureDbdPlayerStats(target.id);
            const prefix = isMultiplayer ? `[Tipp auf ${target.name}] ` : '';

            if (pred.killer === actual.killer) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Killer richtig (${actual.killer}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 2);
                breakdown.push(`${prefix}Killer richtig (${actual.killer}): +20 Pkt & -2 Shots`);
              }
            } else {
              shots += 2;
              breakdown.push(`${prefix}Killer falsch (Tipp: ${pred.killer}): +2 Shots`);
            }

            if (pred.map === actual.map) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 1);
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & -1 Shot`);
              }
            } else {
              shots += 1;
              breakdown.push(`${prefix}Map falsch: +1 Shot`);
            }

            const betMissed = Number(pred.missedChecks) || 0;
            if (betMissed === tStats.missedChecks) {
              points += 10;
              shots = Math.max(0, shots - betMissed);
              breakdown.push(`${prefix}Skillchecks exakt (${tStats.missedChecks}): +10 Pkt & ${betMissed} gewettete Shots gestrichen`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Skillchecks daneben (Tipp: ${betMissed}, Ist: ${tStats.missedChecks}): +1 Shot`);
            }

            const betHooks = Number(pred.hooks) || 0;
            if (betHooks === tStats.hooks) {
              points += 10;
              shots = Math.max(0, shots - betHooks);
              breakdown.push(`${prefix}Haken exakt (${tStats.hooks}): +10 Pkt & ${betHooks} gewettete Shots gestrichen`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Haken daneben (Tipp: ${betHooks}, Ist: ${tStats.hooks}): +1 Shot`);
            }
          });
        } else {
          shots += s.gensRepaired * 1;
          if (s.gensRepaired > 0) breakdown.push(`${s.gensRepaired}x Gens repariert (+${s.gensRepaired} Shots)`);

          points += s.survivorsHooked * 5;
          if (s.survivorsHooked > 0) breakdown.push(`${s.survivorsHooked}x Survivor angehakt (+${s.survivorsHooked * 5} Pkt)`);

          points += s.survivorsKilled * 10;
          if (s.survivorsKilled > 0) breakdown.push(`${s.survivorsKilled}x Survivor gekillt (+${s.survivorsKilled * 10} Pkt)`);

          shots += s.killerStunnedBlinded * 2;
          if (s.killerStunnedBlinded > 0) breakdown.push(`${s.killerStunnedBlinded}x Stun/Blind kassiert (+${s.killerStunnedBlinded * 2} Shots)`);

          shots += s.survivorsEscaped * 1;
          if (s.survivorsEscaped > 0) breakdown.push(`${s.survivorsEscaped}x Survivor entkommen (+${s.survivorsEscaped} Shots)`);

          const actualPerkObj = DBD_EXHAUSTION_PERKS.find(p => p.id === actual.exhaustionPerk);

          targets.forEach(target => {
            const pred = getOrCreatePrediction(player.id, target.id);
            const predPerkObj = DBD_EXHAUSTION_PERKS.find(p => p.id === pred.exhaustionPerk);
            const prefix = isMultiplayer ? `[Tipp auf ${target.name}] ` : '';

            if (pred.exhaustionPerk === actual.exhaustionPerk) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Perk richtig (${actualPerkObj?.name}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 1);
                breakdown.push(`${prefix}Perk richtig (${actualPerkObj?.name}): +20 Pkt & -1 Shot`);
              }
            } else {
              shots += 2;
              breakdown.push(`${prefix}Perk falsch (Tipp: ${predPerkObj?.name}): +2 Shots`);
            }

            if (pred.map === actual.map) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 1);
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & -1 Shot`);
              }
            } else {
              shots += 1;
              breakdown.push(`${prefix}Map falsch: +1 Shot`);
            }

            const betEscaped = Number(pred.escaped) || 0;
            if (betEscaped === s.survivorsEscaped) {
              points += 10;
              shots = Math.max(0, shots - betEscaped);
              breakdown.push(`${prefix}Entkommene Survivor exakt (${s.survivorsEscaped}/4): +10 Pkt & ${betEscaped} gewettete Shots gestrichen`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Entkommene Survivor falsch (Tipp: ${betEscaped}/4): +1 Shot`);
            }

            const betGens = Number(pred.gens) || 0;
            if (betGens === s.gensRepaired) {
              points += 10;
              shots = Math.max(0, shots - betGens);
              breakdown.push(`${prefix}Generatoren exakt (${s.gensRepaired}/5): +10 Pkt & ${betGens} gewettete Shots gestrichen`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Generatoren falsch (Tipp: ${betGens}/5): +1 Shot`);
            }
          });
        }

        return {
          playerId: player.id,
          name: player.name,
          points,
          shots: Math.max(0, shots),
          breakdown
        };
      });

      results.forEach(res => {
        const extra = distributedShots[res.playerId] || 0;
        if (extra > 0) {
          res.shots += extra;
          res.breakdown.push(`+${extra} Shot von Mitspieler verteilt bekommen!`);
        }
        const squadPlayer = state.players.find(p => p.id === res.playerId);
        if (squadPlayer) {
          squadPlayer.sips += res.shots;
        }
      });

      results.sort((a, b) => b.points - a.points || a.shots - b.shots);

      state.dbd.results = results;
      state.dbd.phase = 'leaderboard';
      recordCurrentMatchToArchive();
      savePlayers();
      if (state.lobby.role === 'host') broadcastState();
      render();
      setTimeout(() => triggerVictoryConfetti(), 150);
    }

    function recordCurrentMatchToArchive() {
      const results = state.dbd.results || [];
      if (results.length === 0) return;

      const now = new Date();
      const dateStr = now.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      const modeLabel = state.dbd.mode === 'survivor'
        ? 'Survivor'
        : (state.dbd.killerSubMode === 'spectator' ? 'Killer (Zuschauer)' : 'Killer (Solo)');

      const entryId = `match-${Date.now()}-${results.map(r => r.playerId).join('-')}`;
      if (state.profileArchive.some(item => item.id === entryId)) return;

      const totalShotsInRound = results.reduce((sum, r) => sum + (Number(r.shots) || 0), 0);

      state.profileArchive.unshift({
        id: entryId,
        dateTime: `${dateStr} - ${timeStr}`,
        gameName: 'Dead by Daylight',
        mode: modeLabel,
        totalShots: totalShotsInRound,
        leaderboard: results.map((r, idx) => ({
          rank: idx + 1,
          name: r.name,
          points: r.points,
          shots: r.shots
        }))
      });
      saveArchive();
    }

    // =========================================================================
    // 7. RENDER ENGINE & VIEWS (HUB, PROFIL-ARCHIV, DBD)
    // =========================================================================
    function safeCreateIcons() {
      try {
        if (typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {}
    }
