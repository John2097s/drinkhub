<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GameNight DrinkHub</title>

  <!-- Lokale Bibliotheken (100% Offline-Ready für Android APK) -->
  <script src="js/tailwind.js"></script>
  <script src="js/lucide.js"></script>
  <script src="js/peerjs.min.js"></script>
  <script src="js/confetti.min.js"></script>

  <!-- Fallback-CDN für Vorschau & Browser, falls lokale Dateien nicht geladen wurden -->
  <script>
    if (typeof tailwind === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.tailwindcss.com';
      document.head.appendChild(s);
    }
    if (typeof lucide === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/lucide@latest';
      s.onload = () => { if (typeof safeCreateIcons === 'function') safeCreateIcons(); };
      document.head.appendChild(s);
    }
    if (typeof Peer === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      document.head.appendChild(s);
    }
    if (typeof confetti === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
      document.head.appendChild(s);
    }
  </script>

  <!-- Google Fonts: Inter & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Rajdhani', 'sans-serif'],
            },
            colors: {
              neon: {
                purple: '#a855f7',
                cyan: '#06b6d4',
                pink: '#ec4899',
                emerald: '#10b981',
                amber: '#f59e0b',
                red: '#ef4444'
              }
            }
          }
        }
      };
    }
  </script>

  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    button, select, input {
      touch-action: manipulation;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-card {
      background: rgba(24, 24, 27, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stickerPulse {
      0%, 100% { transform: rotate(8deg) scale(1); }
      50% { transform: rotate(11deg) scale(1.06); }
    }
    .sticker-badge {
      animation: stickerPulse 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col selection:bg-purple-500 selection:text-white text-sm sm:text-base">

  <!-- Ambient Background Glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-24 -left-24 w-72 h-72 bg-purple-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 w-80 h-80 bg-cyan-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/4 w-72 h-72 bg-pink-600/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-30 glass-card border-b border-zinc-800/80 px-3 sm:px-4 py-2.5 sm:py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 cursor-pointer min-w-0" onclick="goHome()">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-purple-600 via-pink-600 to-cyan-500 p-[1px] shadow-lg shadow-purple-500/20 shrink-0">
          <div class="w-full h-full bg-zinc-950 rounded-[11px] flex items-center justify-center">
            <i data-lucide="gamepad-2" class="w-4 h-4 sm:w-5 sm:h-5 text-purple-400"></i>
          </div>
        </div>
        <div class="truncate">
          <h1 class="font-display font-bold text-lg sm:text-xl tracking-wider uppercase leading-none bg-gradient-to-r from-white via-purple-200 to-cyan-200 bg-clip-text text-transparent">
            DrinkHub
          </h1>
          <p class="text-[9px] sm:text-[10px] text-zinc-400 font-medium tracking-widest uppercase">Friends Edition</p>
        </div>
      </div>

      <!-- Lobby & Squad Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="btn-open-lobby" onclick="toggleLobbyModal(true)" class="flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 px-2.5 sm:px-3 py-2 min-h-[40px] rounded-xl text-xs font-semibold transition active:scale-95">
          <span id="lobby-status-dot" class="w-2 h-2 rounded-full bg-zinc-500 shrink-0"></span>
          <span id="lobby-btn-text" class="text-zinc-200 truncate max-w-[95px] sm:max-w-none">Lobby</span>
        </button>

        <button onclick="togglePlayerModal(true)" class="flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 px-2.5 sm:px-3 py-2 min-h-[40px] rounded-xl text-xs font-semibold transition active:scale-95">
          <i data-lucide="users" class="w-4 h-4 text-cyan-400 shrink-0"></i>
          <span id="player-count-badge" class="text-zinc-200">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-container" class="relative z-10 flex-1 max-w-3xl w-full mx-auto px-3 sm:px-4 pt-3 sm:pt-4 pb-24">
    <!-- Wird dynamisch per JS gerendert -->
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-4 w-[90%] max-w-sm">
    <div id="toast-inner" class="bg-zinc-900/95 border border-purple-500/50 text-white px-4 py-3 rounded-2xl shadow-2xl shadow-purple-950/60 flex items-center gap-3 backdrop-blur-md">
      <div class="w-8 h-8 rounded-xl bg-purple-500/20 flex items-center justify-center shrink-0">
        <i data-lucide="beer" class="w-4 h-4 text-purple-400"></i>
      </div>
      <p id="toast-message" class="text-xs font-medium leading-snug"></p>
    </div>
  </div>

  <!-- P2P Lobby Modal -->
  <div id="lobby-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4">
    <div class="glass-card w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-zinc-800 p-5 animate-pop max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="radio" class="w-5 h-5 text-purple-400"></i>
          <h2 class="font-display font-bold text-xl uppercase tracking-wide">Multiplayer Lobby</h2>
        </div>
        <button onclick="toggleLobbyModal(false)" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="lobby-modal-body" class="space-y-4 overflow-y-auto no-scrollbar pr-1">
        <!-- Dynamisch per JS -->
      </div>
    </div>
  </div>

  <!-- Squad / Player Drawer Modal -->
  <div id="player-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4">
    <div class="glass-card w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-zinc-800 p-5 animate-pop max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="trophy" class="w-5 h-5 text-amber-400"></i>
          <h2 class="font-display font-bold text-xl uppercase tracking-wide">Squad & Pegel-Tracker</h2>
        </div>
        <button onclick="togglePlayerModal(false)" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Add Player Form -->
      <form onsubmit="addPlayer(event)" class="flex gap-2 mb-4">
        <input
          type="text"
          id="new-player-input"
          placeholder="Spielername eingeben..."
          maxlength="18"
          class="flex-1 bg-zinc-900/90 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500"
        />
        <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition active:scale-95 flex items-center gap-1">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Add</span>
        </button>
      </form>

      <!-- Players List -->
      <div id="players-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1 no-scrollbar">
        <!-- Dynamisch -->
      </div>

      <!-- Footer Actions -->
      <div class="mt-4 pt-3 border-t border-zinc-800 flex justify-between items-center">
        <button onclick="resetAllDrinks()" class="text-xs text-rose-400 hover:text-rose-300 font-medium flex items-center gap-1.5 py-1.5 px-2 rounded-lg hover:bg-rose-500/10 transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          Alle Schlucke auf 0
        </button>
        <button onclick="togglePlayerModal(false)" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
          Fertig
        </button>
      </div>
    </div>
  </div>

      const savedNameFlag = localStorage.getItem('drinkhub_has_name');
      const savedPlayers = localStorage.getItem('drinkhub_players');
      if (savedPlayers) {
        const parsed = JSON.parse(savedPlayers);
        if (Array.isArray(parsed) && parsed.length > 0 && savedNameFlag === '1') {
          state.players = parsed;
          state.hasSetInitialName = true;
          state.lobby.myPlayerId = parsed[0].id;
          state.lobby.myName = parsed[0].name;
          state.dbd.activeLivePlayerId = parsed[0].id;
        }
      }
    } catch (e) {
      console.warn('LocalStorage nicht verfügbar:', e);
    }

    function setInitialPlayerName(e) {
      e.preventDefault();
      const input = document.getElementById('initial-name-input');
      const name = input ? input.value.trim() : '';
      if (!name) {
        showToast('Bitte gib zuerst deinen Namen ein!');
        return;
      }
      const id = 'p-' + Date.now();
      state.players = [{ id, name, sips: 0 }];
      state.hasSetInitialName = true;
      state.lobby.myPlayerId = id;
      state.lobby.myName = name;
      state.dbd.activeLivePlayerId = id;
      try {
        localStorage.setItem('drinkhub_has_name', '1');
      } catch (err) {}
      savePlayers();
      triggerRumble([60, 40, 80]);
      showToast(`Willkommen, ${name}!`);
      render();
    }

    function savePlayers() {
      try {
        localStorage.setItem('drinkhub_players', JSON.stringify(state.players));
      } catch (e) {}
      updatePlayerBadge();
      if (state.lobby.role === 'host') {
        broadcastState();
      }
    }

    function updatePlayerBadge() {
      const badge = document.getElementById('player-count-badge');
      if (badge) {
        badge.textContent = `${state.players.length}`;
      }
    }

    function triggerRumble(pattern = [120, 60, 180]) {
      try {
        if (typeof navigator !== 'undefined') {
          const vibFn = navigator.vibrate || navigator.webkitVibrate || navigator.mozVibrate;
          if (typeof vibFn === 'function') {
            const normalizedPattern = Array.isArray(pattern)
              ? pattern.map(ms => Math.max(20, Number(ms) || 50))
              : [Math.max(40, Number(pattern) || 120)];
            vibFn.call(navigator, normalizedPattern);
          }
        }
      } catch (e) {}
    }

    function triggerVictoryConfetti() {
      triggerRumble([100, 50, 100, 50, 250]);
      try {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 85,
            spread: 70,
            origin: { y: 0.65 },
            colors: ['#a855f7', '#06b6d4', '#ec4899', '#f59e0b', '#10b981']
          });
          setTimeout(() => {
            confetti({
              particleCount: 50,
              angle: 60,
              spread: 55,
              origin: { x: 0, y: 0.7 }
            });
            confetti({
              particleCount: 50,
              angle: 120,
              spread: 55,
              origin: { x: 1, y: 0.7 }
            });
          }, 280);
        }
      } catch (e) {}
    }

    function updateLobbyBadge() {
      const dot = document.getElementById('lobby-status-dot');
      const txt = document.getElementById('lobby-btn-text');
      if (!dot || !txt) return;

      if (state.lobby.role === 'host') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0';
        txt.textContent = `${state.lobby.code} (${state.players.length}/4)`;
      } else if (state.lobby.role === 'client') {
        dot.className = 'w-2 h-2 rounded-full bg-cyan-400 animate-pulse shrink-0';
        txt.textContent = `#${state.lobby.code}`;
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-zinc-500 shrink-0';
        txt.textContent = 'Lobby';
      }
    }

    // =========================================================================
    // 4. P2P MULTIPLAYER (PEERJS MIT STUN-SERVERN & ROBUSTEM HANDSHAKE)
    // =========================================================================
    const PEER_CONFIG = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    };

    function generateLobbyCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function disconnectLobby(silent = false) {
      try {
        if (Array.isArray(state.lobby.conns)) {
          state.lobby.conns.forEach(conn => {
            try {
              if (conn && typeof conn.close === 'function') conn.close();
            } catch (e) {}
          });
        }
        if (state.lobby.hostConn && typeof state.lobby.hostConn.close === 'function') {
          try {
            state.lobby.hostConn.close();
          } catch (e) {}
        }
        if (state.lobby.peer && typeof state.lobby.peer.destroy === 'function') {
          try {
            state.lobby.peer.destroy();
          } catch (e) {}
        }
      } catch (err) {
        console.error('Fehler beim Trennen der Lobby:', err);
      }

      state.lobby.role = 'offline';
      state.lobby.code = '';
      state.lobby.peer = null;
      state.lobby.conns = [];
      state.lobby.hostConn = null;

      updateLobbyBadge();
      if (!silent) {
        showToast('Lobby geschlossen / verlassen.');
      }
      renderLobbyModal();
      render();
    }

    function hostLobby() {
      if (typeof Peer === 'undefined') {
        showToast('PeerJS konnte nicht geladen werden (Offline?). Lokal-Modus aktiv.');
        return;
      }

      const hostNameInput = document.getElementById('lobby-player-name');
      const hostName = (hostNameInput ? hostNameInput.value.trim() : '') || state.players[0]?.name || 'Host';

      disconnectLobby(true);

      const code = generateLobbyCode();
      const peerId = `drinkhub-gamenight-${code}`;

      const hostPlayerId = state.players[0]?.id || ('p-' + Date.now());
      state.players = [{ id: hostPlayerId, name: hostName, sips: state.players[0]?.sips || 0 }];
      state.hasSetInitialName = true;
      state.lobby.myPlayerId = hostPlayerId;
      state.lobby.myName = hostName;
      state.dbd.activeLivePlayerId = hostPlayerId;
      try { localStorage.setItem('drinkhub_has_name', '1'); } catch (e) {}
      savePlayers();

      showToast(`Erstelle Lobby ${code}...`);

      try {
        const peer = new Peer(peerId, PEER_CONFIG);
        state.lobby.peer = peer;
        state.lobby.role = 'host';
        state.lobby.code = code;
        state.lobby.conns = [];

        peer.on('open', () => {
          updateLobbyBadge();
          renderLobbyModal();
          triggerRumble([60]);
          showToast(`Lobby ${code} aktiv! Du bist drin (1/4).`);
        });

        peer.on('connection', (conn) => {
          state.lobby.conns.push(conn);

          conn.on('open', () => {
            broadcastState();
          });

          conn.on('data', (msg) => {
            handleHostMessage(conn, msg);
          });

          conn.on('close', () => {
            state.lobby.conns = state.lobby.conns.filter(c => c !== conn);
            renderLobbyModal();
            updateLobbyBadge();
          });
        });

        peer.on('disconnected', () => {
          if (peer && !peer.destroyed) {
            try { peer.reconnect(); } catch (e) {}
          }
        });

        peer.on('error', (err) => {
          console.error('PeerJS Host Error:', err);
          if (err.type === 'unavailable-id') {
            hostLobby();
          } else {
            showToast(`P2P Hinweis (${err.type}) – Lokal-Modus aktiv.`);
          }
        });
      } catch (e) {
        showToast('P2P Start fehlgeschlagen – Lokal-Modus aktiv.');
      }
    }

    function joinLobby() {
      if (typeof Peer === 'undefined') {
        showToast('PeerJS nicht verfügbar (Offline?).');
        return;
      }

      const codeInput = document.getElementById('join-lobby-code');
      const nameInput = document.getElementById('lobby-player-name');
      const code = codeInput ? codeInput.value.replace(/\D/g, '').trim() : '';
      const playerName = (nameInput ? nameInput.value.trim() : '') || 'Spieler';

      if (code.length !== 4) {
        showToast('Bitte einen 4-stelligen Lobby-Code eingeben!');
        return;
      }

      disconnectLobby(true);

      const myId = 'p-' + Math.random().toString(36).substring(2, 7);
      state.lobby.myPlayerId = myId;
      state.lobby.myName = playerName;

      showToast(`Verbinde mit Lobby ${code}...`);

      try {
        const peer = new Peer(PEER_CONFIG);
        state.lobby.peer = peer;

        const connectTimeout = setTimeout(() => {
          if (state.lobby.role !== 'client') {
            showToast('Zeitüberschreitung – prüfe den Code & ob beide Geräte Netz haben.');
            disconnectLobby(true);
          }
        }, 10000);

        peer.on('open', () => {
          const conn = peer.connect(`drinkhub-gamenight-${code}`, {
            reliable: true,
            serialization: 'json'
          });
          state.lobby.hostConn = conn;

          conn.on('open', () => {
            clearTimeout(connectTimeout);
            state.lobby.role = 'client';
            state.lobby.code = code;
            updateLobbyBadge();
            triggerRumble([60, 40, 80]);
            conn.send({
              type: 'JOIN',
              player: { id: myId, name: playerName, sips: 0 }
            });
            showToast(`Lobby ${code} beigetreten!`);
            renderLobbyModal();
          });

          conn.on('data', (msg) => {
            if (msg && msg.type === 'SYNC_STATE') {
              applySyncedState(msg.payload);
            }
          });

          conn.on('close', () => {
            clearTimeout(connectTimeout);
            showToast('Verbindung zum Host getrennt.');
            disconnectLobby(true);
          });

          conn.on('error', () => {
            clearTimeout(connectTimeout);
            showToast('Verbindung zum Host fehlgeschlagen.');
            disconnectLobby(true);
          });
        });

        peer.on('error', (err) => {
          clearTimeout(connectTimeout);
          console.error('PeerJS Join Error:', err);
          if (err.type === 'peer-unavailable') {
            showToast(`Lobby #${code} existiert nicht (Code prüfen!).`);
          } else {
            showToast(`Verbindungsfehler (${err.type}).`);
          }
          disconnectLobby(true);
        });
      } catch (e) {
        showToast('Fehler beim Beitreten.');
      }
    }

    function handleHostMessage(conn, msg) {
      if (!msg || !msg.type) return;

      if (msg.type === 'JOIN' && msg.player) {
        if (state.players.length >= 4) {
          showToast(`${msg.player.name} wollte joinen, Lobby ist voll (4/4).`);
          return;
        }
        const exists = state.players.find(p => p.id === msg.player.id);
        if (!exists) {
          state.players.push(msg.player);
          savePlayers();
          showToast(`${msg.player.name} ist der Lobby beigetreten!`);
        }
        broadcastState();
        renderLobbyModal();
        render();
      } else if (msg.type === 'DBD_PREDICTION') {
        if (!state.dbd.predictions[msg.playerId]) {
          state.dbd.predictions[msg.playerId] = {};
        }
        state.dbd.predictions[msg.playerId][msg.targetId] = msg.prediction;
        broadcastState();
        render();
      } else if (msg.type === 'DBD_READY') {
        state.dbd.readyPlayers[msg.playerId] = Boolean(msg.ready);
        if (state.dbd.mode === 'killer' && state.dbd.killerSubMode === 'spectator' && areAllDbdPlayersReady()) {
          startDbdLiveRound();
        } else {
          broadcastState();
          render();
        }
      } else if (msg.type === 'DBD_LIVE_ACTION') {
        applyDbdLiveAction(msg.action, msg.targetPlayerId, true);
      } else if (msg.type === 'DBD_REVIEW_READY') {
        state.dbd.reviewReadyPlayers[msg.playerId] = true;
        if (areAllDbdPlayersReviewReady()) {
          evaluateDbdMatch();
        } else {
          broadcastState();
          render();
        }
      }
    }

    function areAllDbdPlayersReady() {
      const participants = getDbdParticipants();
      if (participants.length === 0) return false;
      return participants.every(p => Boolean(state.dbd.readyPlayers[p.id]));
    }

    function areAllDbdPlayersReviewReady() {
      const participants = getDbdParticipants();
      if (participants.length === 0) return false;
      return participants.every(p => Boolean(state.dbd.reviewReadyPlayers[p.id]));
    }

    function broadcastState() {
      if (state.lobby.role !== 'host') return;
      const payload = {
        view: state.view,
        selectedFranchiseId: state.selectedFranchiseId,
        selectedGameId: state.selectedGameId,
        players: state.players,
        dbd: state.dbd
      };
      state.lobby.conns.forEach(conn => {
        if (conn && conn.open) {
          conn.send({ type: 'SYNC_STATE', payload });
        }
      });
    }

    function applySyncedState(payload) {
      if (!payload) return;
      state.view = payload.view;
      state.selectedFranchiseId = payload.selectedFranchiseId;
      state.selectedGameId = payload.selectedGameId;
      state.players = payload.players;
      state.dbd = payload.dbd;
      updatePlayerBadge();
      renderLobbyModal();
      render();
    }

    // 5. NAVIGATION, SUCHE & SQUAD-VERWALTUNG
    // =========================================================================
    function goHome() {
      state.view = 'hub';
      state.selectedFranchiseId = null;
      state.selectedGameId = null;
      state.currentCard = null;
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function handleSearch(val) {
      state.searchQuery = val;
      render();
    }

    function setGenreFilter(genre) {
      state.selectedGenre = genre;
      render();
    }

    function getFilteredGames() {
      const q = state.searchQuery.trim().toLowerCase();
      return GAMES_DB.filter(g => {
        const matchesGenre = state.selectedGenre === 'all' || g.genre === state.selectedGenre;
        if (!matchesGenre) return false;
        if (!q) return true;
        if (g.title.toLowerCase().includes(q) || g.subtitle.toLowerCase().includes(q)) return true;
        if (g.isFranchise && Array.isArray(g.subGames)) {
          return g.subGames.some(sub => sub.title.toLowerCase().includes(q) || sub.tag.toLowerCase().includes(q));
        }
        return false;
      });
    }

    function openGameOrFranchise(id) {
      const item = GAMES_DB.find(g => g.id === id);
      if (!item) return;

      if (item.isFranchise) {
        state.view = 'franchise';
        state.selectedFranchiseId = item.id;
      } else {
        state.view = 'game';
        state.selectedGameId = item.id;
        state.activeTab = 'rules';
        state.currentCard = null;
        if (item.isCustomDbd) {
          resetDbdMatch('role');
        }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function openSubGame(franchiseId, subGameId) {
      state.view = 'game';
      state.selectedFranchiseId = franchiseId;
      state.selectedGameId = subGameId;
      state.activeTab = 'rules';
      state.currentCard = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function getActiveGame() {
      if (state.selectedFranchiseId) {
        const franchise = GAMES_DB.find(g => g.id === state.selectedFranchiseId);
        if (franchise) {
          return franchise.subGames.find(s => s.id === state.selectedGameId);
        }
      }
      return GAMES_DB.find(g => g.id === state.selectedGameId);
    }

    function togglePlayerModal(show) {
      const modal = document.getElementById('player-modal');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderPlayersList();
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function addPlayer(e) {
      e.preventDefault();
      const input = document.getElementById('new-player-input');
      const name = input.value.trim();
      if (!name) return;

      const newId = 'p-' + Date.now();
      state.players.push({ id: newId, name, sips: 0 });
      input.value = '';
      savePlayers();
      renderPlayersList();
      render();
      showToast(`${name} ist dem Squad beigetreten!`);
    }

    function removePlayer(id) {
      if (state.players.length <= 1) {
        showToast('Mindestens 1 Spieler muss im Squad bleiben!');
        return;
      }
      state.players = state.players.filter(p => p.id !== id);
      if (state.dbd.activeLivePlayerId === id) {
        state.dbd.activeLivePlayerId = state.players[0].id;
      }
      savePlayers();
      renderPlayersList();
      render();
    }

    function adjustPlayerSips(id, delta) {
      const player = state.players.find(p => p.id === id);
      if (!player) return;
      player.sips = Math.max(0, player.sips + delta);
      savePlayers();
      renderPlayersList();
    }

    function resetAllDrinks() {
      state.players.forEach(p => p.sips = 0);
      savePlayers();
      renderPlayersList();
      showToast('Alle Schlucke wurden auf 0 zurückgesetzt.');
    }

    function renderPlayersList() {
      const container = document.getElementById('players-list');
      if (!container) return;

      container.innerHTML = state.players.map((p, idx) => `
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 flex items-center justify-between gap-2">

            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-white truncate">${p.name}</span>
              ${idx === 0 ? '<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">Du / Host</span>' : ''}
            </div>
            <p class="text-xs text-amber-400 font-semibold mt-0.5">${p.sips} ${p.sips === 1 ? 'Schluck' : 'Schlucke'}</p>

            <button onclick="adjustPlayerSips('${p.id}', 1)" class="w-8 h-8 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-90">+</button>
            ${state.players.length > 1 ? `
              <button onclick="removePlayer('${p.id}')" class="w-8 h-8 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 flex items-center justify-center active:scale-90" title="Entfernen">

              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
      safeCreateIcons();
    }

    function ensureDbdPlayerStats(playerId) {
      if (!playerId) {
        return { missedChecks: 0, hooks: 0, stunsBlinds: 0, healsUnhooks: 0 };
      }
      if (!state.dbd.liveStats) {
        state.dbd.liveStats = {
          byPlayer: {},
          gensRepaired: 0,
          survivorsHooked: 0,
          survivorsKilled: 0,
          killerStunnedBlinded: 0,
          survivorsEscaped: 0
        };
      }
      if (!state.dbd.liveStats.byPlayer) {
        state.dbd.liveStats.byPlayer = {};
      }
      if (!state.dbd.liveStats.byPlayer[playerId]) {
        state.dbd.liveStats.byPlayer[playerId] = {
          missedChecks: 0,
          hooks: 0,
          stunsBlinds: 0,
          healsUnhooks: 0
        };
      }
      return state.dbd.liveStats.byPlayer[playerId];
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      if (!toast || !msgEl) return;

      msgEl.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2800);
    }

    // =========================================================================
    // 6. DEAD BY DAYLIGHT LOGIK (SURVIVOR, KILLER, VORHERSAGEN & AUSWERTUNG)
    // =========================================================================
    function resetDbdMatch(targetPhase = 'role', rotateKiller = false) {
      const byPlayer = {};
      state.players.forEach(p => {
        byPlayer[p.id] = {
          missedChecks: 0,
          hooks: 0,
          stunsBlinds: 0,
          healsUnhooks: 0
        };
      });

      const nextKillerIndex = rotateKiller && state.players.length > 0
        ? (state.dbd.killerPlayerIndex + 1) % state.players.length
        : (state.dbd.killerPlayerIndex || 0);

      state.dbd = {
        phase: targetPhase,
        mode: state.dbd.mode || 'survivor',
        killerSubMode: state.dbd.killerSubMode || 'solo',
        killerPlayerIndex: nextKillerIndex,
        activePredictPlayerIndex: 0,
        activeLivePlayerId: state.players[0]?.id || '',
        predictions: {},
        readyPlayers: {},
        liveStats: {
          byPlayer,
          gensRepaired: 0,
          survivorsHooked: 0,
          survivorsKilled: 0,
          killerStunnedBlinded: 0,
          survivorsEscaped: 0
        },
        actualOutcome: {
          killer: DBD_KILLERS[0],
          map: DBD_MAPS[0],
          exhaustionPerk: DBD_EXHAUSTION_PERKS[0].id
        },
        reviewReadyPlayers: {},
        results: []
      };
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function getCurrentKillerPlayer() {
      if (state.players.length === 0) return null;
      const idx = state.dbd.killerPlayerIndex % state.players.length;
      return state.players[idx];
    }

    function getPredictionTargetsFor(predictorId) {
      const isMultiplayer = state.lobby.role !== 'offline' || state.players.length > 1;
      if (!isMultiplayer) {
        return state.players.filter(p => p.id === predictorId);
      }
      if (state.dbd.mode === 'killer' && state.dbd.killerSubMode === 'spectator') {
        const killerPlayer = getCurrentKillerPlayer();
        return killerPlayer ? [killerPlayer] : state.players.filter(p => p.id !== predictorId);
      }
      return state.players.filter(p => p.id !== predictorId);
    }

    function getOrCreatePrediction(predictorId, targetId) {
      if (!state.dbd.predictions[predictorId]) {
        state.dbd.predictions[predictorId] = {};
      }
      if (!state.dbd.predictions[predictorId][targetId]) {
        state.dbd.predictions[predictorId][targetId] = {
          killer: DBD_KILLERS[0],
          map: DBD_MAPS[0],
          missedChecks: 1,
          hooks: 1,
          escaped: 2,
          gens: 3,
          exhaustionPerk: DBD_EXHAUSTION_PERKS[1].id
        };
      }
      return state.dbd.predictions[predictorId][targetId];
    }

    function selectDbdMode(mode, killerSubMode = 'solo') {
      state.dbd.mode = mode;
      state.dbd.killerSubMode = killerSubMode;
      state.dbd.phase = 'predict';
      state.dbd.activePredictPlayerIndex = 0;
      state.dbd.readyPlayers = {};
      state.dbd.reviewReadyPlayers = {};

      const participants = getDbdParticipants();
      participants.forEach(p => {
        const targets = getPredictionTargetsFor(p.id);
        targets.forEach(t => getOrCreatePrediction(p.id, t.id));
        ensureDbdPlayerStats(p.id);
      });

      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function getDbdParticipants() {
      if (state.dbd.mode === 'killer' && state.dbd.killerSubMode === 'solo') {
        if (state.lobby.role === 'client') {
          const me = state.players.find(p => p.id === state.lobby.myPlayerId);
          return me ? [me] : [];
        }
        return state.players.length > 0 ? [state.players[0]] : [];
      }
      return state.players;
    }

    function updateDbdPredictionField(predictorId, targetId, field, value) {
      const pred = getOrCreatePrediction(predictorId, targetId);
      pred[field] = value;

      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_PREDICTION',
          playerId: predictorId,
          targetId,
          prediction: pred
        });
      } else if (state.lobby.role === 'host') {
        broadcastState();
      }
      render();
    }

    function markPlayerDbdReady(playerId) {
      state.dbd.readyPlayers[playerId] = true;
      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_READY',
          playerId,
          ready: true
        });
        render();
        return;
      }

      if (state.lobby.role === 'host') {
        if (areAllDbdPlayersReady()) {
          startDbdLiveRound();
        } else {
          broadcastState();
          render();
        }
        return;
      }

      const participants = getDbdParticipants();
      if (state.dbd.activePredictPlayerIndex < participants.length - 1) {
        state.dbd.activePredictPlayerIndex++;
        render();
      } else {
        startDbdLiveRound();
      }
    }

    function startDbdLiveRound() {
      state.dbd.phase = 'live';
      const killerPlayer = getCurrentKillerPlayer();
      state.dbd.activeLivePlayerId = (state.dbd.mode === 'killer' && killerPlayer)
        ? killerPlayer.id
        : (state.players[0]?.id || '');
      state.players.forEach(p => ensureDbdPlayerStats(p.id));
      if (state.lobby.role === 'host') broadcastState();
      render();
      showToast('Alle bereit! Runde gestartet!');
    }

    function setActiveLivePlayer(playerId) {
      if (state.lobby.role !== 'offline') return;
      state.dbd.activeLivePlayerId = playerId;
      ensureDbdPlayerStats(playerId);
      render();
    }

    function triggerDbdLiveEvent(action, explicitTargetPlayerId = null) {
      const targetId = explicitTargetPlayerId || (
        state.lobby.role === 'client'
          ? state.lobby.myPlayerId
          : state.dbd.activeLivePlayerId
      );

      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_LIVE_ACTION',
          action,
          targetPlayerId: targetId
        });
        return;
      }
      applyDbdLiveAction(action, targetId, false);
    }

    function applyDbdLiveAction(action, targetPlayerId, fromRemote) {
      const s = state.dbd.liveStats;
      const pStats = ensureDbdPlayerStats(targetPlayerId);
      const targetPlayer = state.players.find(p => p.id === targetPlayerId);
      const pName = targetPlayer ? targetPlayer.name : 'Spieler';

      if (state.dbd.mode === 'survivor') {
        if (action === 'missedCheck') {
          pStats.missedChecks++;
          triggerRumble([140, 60, 140]);
          if (!fromRemote) showToast(`${pName}: Skillcheck verfehlt (+1 Shot)`);
        } else if (action === 'hook') {
          if (pStats.hooks >= 3) {
            if (!fromRemote) showToast(`${pName} ist bereits bei 3/3 Haken (Tot)!`);
            return;
          }
          pStats.hooks++;
          if (pStats.hooks === 3) {
            triggerRumble([250, 80, 250, 80, 350]);
            if (!fromRemote) showToast(`${pName}: 3. Haken = TOD (+3 Shots)!`);
          } else {
            triggerRumble([150, 70, 150]);
            if (!fromRemote) showToast(`${pName}: Haken ${pStats.hooks}/3 (+1 Shot)`);
          }
        } else if (action === 'stunBlind') {
          pStats.stunsBlinds++;
          triggerRumble([45]);
          if (!fromRemote) showToast(`${pName}: Killer gestunt/geblendet (+10 Pkt)`);
        } else if (action === 'healUnhook') {
          pStats.healsUnhooks++;
          triggerRumble([45]);
          if (!fromRemote) showToast(`${pName}: Geheilt / Vom Haken gerettet (+10 Pkt)`);
        }
      } else {
        if (action === 'genRepaired') {
          if (s.gensRepaired >= 5) return;
          s.gensRepaired++;
          triggerRumble([140, 60, 140]);
          if (!fromRemote) showToast(`Generator repariert (${s.gensRepaired}/5 -> +1 Shot)`);
        } else if (action === 'survHooked') {
          if (s.survivorsHooked >= 12) return;
          s.survivorsHooked++;
          triggerRumble([45]);
          if (!fromRemote) showToast('Survivor angehakt (+5 Punkte)');
        } else if (action === 'survKilled') {
          if (s.survivorsKilled >= 4) return;
          s.survivorsKilled++;
          triggerRumble([50, 30, 70]);
          if (!fromRemote) showToast(`Survivor gekillt (${s.survivorsKilled}/4 -> +10 Punkte)`);
        } else if (action === 'killerStunned') {
          s.killerStunnedBlinded++;
          triggerRumble([180, 70, 180]);
          if (!fromRemote) showToast('Stun / Blind kassiert (+2 Shots)');
        } else if (action === 'survEscaped') {
          if (s.survivorsEscaped >= 4) return;
          s.survivorsEscaped++;
          triggerRumble([150, 60, 150]);
          if (!fromRemote) showToast(`Survivor entkommen (${s.survivorsEscaped}/4 -> +1 Shot)`);
        }
      }

      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function adjustReviewPlayerStat(playerId, field, delta, min = 0, max = 99) {
      const pStats = ensureDbdPlayerStats(playerId);
      const next = (pStats[field] || 0) + delta;
      pStats[field] = Math.max(min, Math.min(max, next));
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function adjustReviewGlobalStat(field, delta, min = 0, max = 99) {
      const next = (state.dbd.liveStats[field] || 0) + delta;
      state.dbd.liveStats[field] = Math.max(min, Math.min(max, next));
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function goToDbdReview() {
      state.dbd.phase = 'review';
      state.dbd.reviewReadyPlayers = {};
      if (state.lobby.role === 'host') broadcastState();
      render();
    }

    function confirmDbdReviewForPlayer(playerId) {
      state.dbd.reviewReadyPlayers[playerId] = true;
      if (state.lobby.role === 'client') {
        state.lobby.hostConn.send({
          type: 'DBD_REVIEW_READY',
          playerId
        });
        render();
        return;
      }
      if (state.lobby.role === 'host') {
        if (areAllDbdPlayersReviewReady()) {
          evaluateDbdMatch();
        } else {
          broadcastState();
          render();
        }
        return;
      }
      evaluateDbdMatch();
    }

    function evaluateDbdMatch() {
      const s = state.dbd.liveStats;
      const actual = state.dbd.actualOutcome;
      const participants = getDbdParticipants();
      const isMultiplayer = state.lobby.role !== 'offline' || state.players.length > 1;
      const distributedShots = {};

      const results = participants.map(player => {
        const pStats = ensureDbdPlayerStats(player.id);
        let points = 0;
        let shots = 0;
        const breakdown = [];
        const targets = getPredictionTargetsFor(player.id);

        if (state.dbd.mode === 'survivor') {
          shots += pStats.missedChecks * 1;
          if (pStats.missedChecks > 0) breakdown.push(`${pStats.missedChecks}x Skillcheck verfehlt (+${pStats.missedChecks} Shots)`);

          let hookShots = 0;
          if (pStats.hooks === 1) hookShots = 1;
          else if (pStats.hooks === 2) hookShots = 2;
          else if (pStats.hooks >= 3) hookShots = 5;
          shots += hookShots;
          if (pStats.hooks > 0) breakdown.push(`${pStats.hooks}/3 Haken (+${hookShots} Shots)`);

          points += pStats.stunsBlinds * 10;
          if (pStats.stunsBlinds > 0) breakdown.push(`${pStats.stunsBlinds}x Stun/Blind (+${pStats.stunsBlinds * 10} Pkt)`);

          points += pStats.healsUnhooks * 10;
          if (pStats.healsUnhooks > 0) breakdown.push(`${pStats.healsUnhooks}x Heal/Unhook (+${pStats.healsUnhooks * 10} Pkt)`);

          targets.forEach(target => {
            const pred = getOrCreatePrediction(player.id, target.id);
            const tStats = ensureDbdPlayerStats(target.id);
            const prefix = isMultiplayer ? `[Tipp auf ${target.name}] ` : '';

            if (pred.killer === actual.killer) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Killer richtig (${actual.killer}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 2);
                breakdown.push(`${prefix}Killer richtig (${actual.killer}): +20 Pkt & -2 Shots`);
              }
            } else {
              shots += 2;
              breakdown.push(`${prefix}Killer falsch (Tipp: ${pred.killer}): +2 Shots`);
            }

            if (pred.map === actual.map) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 1);
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & -1 Shot`);
              }
            } else {
              shots += 1;
              breakdown.push(`${prefix}Map falsch: +1 Shot`);
            }

            if (Number(pred.missedChecks) === tStats.missedChecks) {
              points += 10;
              breakdown.push(`${prefix}Skillchecks exakt (${tStats.missedChecks}): +10 Pkt`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Skillchecks daneben (Tipp: ${pred.missedChecks}, Ist: ${tStats.missedChecks}): +1 Shot`);
            }

            if (Number(pred.hooks) === tStats.hooks) {
              points += 10;
              breakdown.push(`${prefix}Haken exakt (${tStats.hooks}): +10 Pkt`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Haken daneben (Tipp: ${pred.hooks}, Ist: ${tStats.hooks}): +1 Shot`);
            }
          });
        } else {
          shots += s.gensRepaired * 1;
          if (s.gensRepaired > 0) breakdown.push(`${s.gensRepaired}x Gens repariert (+${s.gensRepaired} Shots)`);

          points += s.survivorsHooked * 5;
          if (s.survivorsHooked > 0) breakdown.push(`${s.survivorsHooked}x Survivor angehakt (+${s.survivorsHooked * 5} Pkt)`);

          points += s.survivorsKilled * 10;
          if (s.survivorsKilled > 0) breakdown.push(`${s.survivorsKilled}x Survivor gekillt (+${s.survivorsKilled * 10} Pkt)`);

          shots += s.killerStunnedBlinded * 2;
          if (s.killerStunnedBlinded > 0) breakdown.push(`${s.killerStunnedBlinded}x Stun/Blind kassiert (+${s.killerStunnedBlinded * 2} Shots)`);

          shots += s.survivorsEscaped * 1;
          if (s.survivorsEscaped > 0) breakdown.push(`${s.survivorsEscaped}x Survivor entkommen (+${s.survivorsEscaped} Shots)`);

          const actualPerkObj = DBD_EXHAUSTION_PERKS.find(p => p.id === actual.exhaustionPerk);

          targets.forEach(target => {
            const pred = getOrCreatePrediction(player.id, target.id);
            const predPerkObj = DBD_EXHAUSTION_PERKS.find(p => p.id === pred.exhaustionPerk);
            const prefix = isMultiplayer ? `[Tipp auf ${target.name}] ` : '';

            if (pred.exhaustionPerk === actual.exhaustionPerk) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Perk richtig (${actualPerkObj?.name}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 1);
                breakdown.push(`${prefix}Perk richtig (${actualPerkObj?.name}): +20 Pkt & -1 Shot`);
              }
            } else {
              shots += 2;
              breakdown.push(`${prefix}Perk falsch (Tipp: ${predPerkObj?.name}): +2 Shots`);
            }

            if (pred.map === actual.map) {
              points += 20;
              if (isMultiplayer) {
                const other = participants.find(x => x.id !== player.id);
                if (other) distributedShots[other.id] = (distributedShots[other.id] || 0) + 1;
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & 1 Shot verteilt!`);
              } else {
                shots = Math.max(0, shots - 1);
                breakdown.push(`${prefix}Map richtig (${actual.map}): +20 Pkt & -1 Shot`);
              }
            } else {
              shots += 1;
              breakdown.push(`${prefix}Map falsch: +1 Shot`);
            }

            if (Number(pred.escaped) === s.survivorsEscaped) {
              points += 10;
              breakdown.push(`${prefix}Entkommene Survivor exakt (${s.survivorsEscaped}/4): +10 Pkt`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Entkommene Survivor falsch (Tipp: ${pred.escaped}/4): +1 Shot`);
            }

            if (Number(pred.gens) === s.gensRepaired) {
              points += 10;
              breakdown.push(`${prefix}Generatoren exakt (${s.gensRepaired}/5): +10 Pkt`);
            } else {
              shots += 1;
              breakdown.push(`${prefix}Generatoren falsch (Tipp: ${pred.gens}/5): +1 Shot`);
            }
          });
        }

        return {
          playerId: player.id,
          name: player.name,
          points,
          shots: Math.max(0, shots),
          breakdown
        };
      });

      results.forEach(res => {
        const extra = distributedShots[res.playerId] || 0;
        if (extra > 0) {
          res.shots += extra;
          res.breakdown.push(`+${extra} Shot von Mitspieler verteilt bekommen!`);
        }
        const squadPlayer = state.players.find(p => p.id === res.playerId);
        if (squadPlayer) {
          squadPlayer.sips += res.shots;
        }
      });

      results.sort((a, b) => b.points - a.points || a.shots - b.shots);

      state.dbd.results = results;
      state.dbd.phase = 'leaderboard';
      savePlayers();
      if (state.lobby.role === 'host') broadcastState();
      render();
      setTimeout(() => triggerVictoryConfetti(), 150);
    }

    // =========================================================================
    // 7. STANDARD SPIEL LOGIK (ANDERE SPIELE IM HUB)
    // =========================================================================
    function setActiveTab(tab) {
      state.activeTab = tab;
      render();
    }

    function setIntensity(level) {
      state.intensity = level;
      render();
    }

    function getScaledSips(baseSips) {
      if (state.intensity === 'chill') return Math.max(1, baseSips - 1);
      if (state.intensity === 'hardcore') return baseSips + 2;
      return baseSips;
    }

    function triggerRule(sips, ruleText) {
      const scaled = getScaledSips(sips);
      triggerRumble([120, 60, 160]);
      if (state.players.length === 1) {
        adjustPlayerSips(state.players[0].id, scaled);
        showToast(`${state.players[0].name} trinkt ${scaled} ${scaled === 1 ? 'Schluck' : 'Schlucke'}!`);
      } else {
        showToast(`Event aktiv! ${scaled} ${scaled === 1 ? 'Schluck' : 'Schlucke'} – wähle unten wen es trifft.`);
      }
      state.pendingDrink = { sips: scaled, text: ruleText };
      render();
    }

    function assignPendingDrink(playerId) {
      if (!state.pendingDrink) return;
      const { sips } = state.pendingDrink;
      if (playerId === 'ALL') {
        state.players.forEach(p => p.sips += sips);
        savePlayers();
        showToast(`Alle trinken ${sips} ${sips === 1 ? 'Schluck' : 'Schlucke'}! Prost!`);
      } else {
        const player = state.players.find(p => p.id === playerId);
        if (player) {
          player.sips += sips;
          savePlayers();
          showToast(`${player.name} bekommt +${sips} ${sips === 1 ? 'Schluck' : 'Schlucke'}!`);
        }
      }
      state.pendingDrink = null;
      render();
    }

    function dismissPendingDrink() {
      state.pendingDrink = null;
      render();
    }

    function drawRandomCard() {
      const game = getActiveGame();
      if (!game || !game.cards || game.cards.length === 0) return;
      let nextCard = game.cards[Math.floor(Math.random() * game.cards.length)];
      if (game.cards.length > 1 && nextCard === state.currentCard) {
        const others = game.cards.filter(c => c !== state.currentCard);
        nextCard = others[Math.floor(Math.random() * others.length)];
      }
      state.currentCard = nextCard;
      render();
    }

    // =========================================================================
    // 8. RENDER ENGINE
    // =========================================================================
    function safeCreateIcons() {
      try {
        if (typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {}
    }

    function renderHubView() {
      const filtered = getFilteredGames();
      const genres = [
        { id: 'all', label: 'Alle Games' },
        { id: 'horror', label: 'Horror' },
        { id: 'shooter', label: 'Shooter' },
        { id: 'coop', label: 'Koop-Chaos' },
        { id: 'stealth', label: 'Stealth' }
      ];

      return `
        <div class="space-y-4 animate-pop">
          <div class="glass-card rounded-3xl p-4 sm:p-5 border border-purple-500/20 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-purple-400">Game-Hub</span>
                <h2 class="font-display font-bold text-2xl text-white uppercase tracking-wide">Wähle dein Spiel</h2>
              </div>
              <span class="text-xs font-semibold text-zinc-400 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full">
                ${filtered.length} Titel
              </span>
            </div>

            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                value="${state.searchQuery.replace(/"/g, '&quot;')}"
                oninput="handleSearch(this.value)"
                placeholder="Spiel oder Teil suchen (z. B. RE 7, MW2, Phasmo)..."
                class="w-full bg-zinc-900/90 border border-zinc-700/80 rounded-2xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500"
              />
            </div>

            <div class="flex gap-2 overflow-x-auto no-scrollbar pt-0.5">
              ${genres.map(g => {
                const active = state.selectedGenre === g.id;
                return `
                  <button
                    onclick="setGenreFilter('${g.id}')"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition active:scale-95 ${
                      active
                        ? 'bg-gradient-to-r from-purple-600 to-cyan-600 text-white shadow'
                        : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                    }">
                    ${g.label}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          ${filtered.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center border border-zinc-800 space-y-2">
              <p class="text-sm font-semibold text-zinc-300">Keine passenden Spiele gefunden.</p>
              <button onclick="state.searchQuery=''; state.selectedGenre='all'; render();" class="text-xs text-purple-400 hover:underline font-semibold">
                Filter zurücksetzen
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${filtered.map(game => `
                <div
                  onclick="openGameOrFranchise('${game.id}')"
                  class="glass-card hover:bg-zinc-900/90 border ${game.borderAccent || 'border-zinc-800'} rounded-3xl p-4 cursor-pointer transition active:scale-[0.98] relative overflow-hidden flex flex-col justify-between gap-3"
                >
                  <div class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${game.accent || 'from-purple-600 to-zinc-900'} flex items-center justify-center shrink-0 shadow-lg">
                        <i data-lucide="${game.icon || 'gamepad-2'}" class="w-6 h-6 text-white"></i>
                      </div>
                      <div class="min-w-0">
                        <h3 class="font-display font-bold text-xl text-white uppercase tracking-wide truncate">${game.title}</h3>
                        <p class="text-xs text-zinc-400 truncate">${game.subtitle}</p>

                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-zinc-900/90 border border-zinc-700/80 text-zinc-300 shrink-0">

                  </div>

              `).join('')}
            </div>
          `}
        </div>
      `;
    }

        <div class="space-y-4 animate-pop">

              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>Alle Games</span>
            </button>
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300 bg-purple-500/10 border border-purple-500/30 px-3 py-1 rounded-full">

              >
                <div class="min-w-0">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-400">${sub.tag}</span>
