    function render() {
      updatePlayerBadge();
      updateLobbyBadge();
      const container = document.getElementById('app-container');

      if (!state.hasSetInitialName || state.players.length === 0) {
        container.innerHTML = renderInitialNameView();
        safeCreateIcons();
        return;
      }

      if (state.view === 'hub') {
        container.innerHTML = renderHubView();
      } else if (state.view === 'franchise') {
        container.innerHTML = renderFranchiseView();
      } else if (state.view === 'game') {
        const game = getActiveGame();
        if (game && game.isCustomDbd) {
          container.innerHTML = renderDbdView();
        } else {
          container.innerHTML = renderGameView();
        }
      }
      safeCreateIcons();
    }

    function renderInitialNameView() {
      return `
        <div class="max-w-md mx-auto pt-6 animate-pop">
          <div class="glass-card rounded-3xl p-6 border border-purple-500/30 space-y-5">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center shadow-lg">
              <i data-lucide="user-plus" class="w-6 h-6 text-white"></i>
            </div>
            <div>
              <span class="text-[10px] font-bold uppercase tracking-widest text-purple-400">Willkommen bei DrinkHub</span>
              <h2 class="font-display font-bold text-2xl text-white uppercase mt-1">Wie heißt du?</h2>
              <p class="text-xs text-zinc-400 mt-1">
                Lege deinen Spielernamen fest. Du kannst ihn jederzeit oben über den Squad-Button ändern oder ergänzen.
              </p>
            </div>
            <form onsubmit="setInitialPlayerName(event)" class="space-y-3">
              <input
                id="initial-name-input"
                type="text"
                maxlength="18"
                placeholder="Dein Name..."
                required
                class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500"
              />
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 text-white font-display font-bold text-base uppercase tracking-wider shadow-lg transition active:scale-95">
                Los geht's
              </button>
            </form>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. DEAD BY DAYLIGHT UI (ALLE 5 PHASEN)
    // =========================================================================
    function renderDbdView() {
      const dbd = state.dbd;

      const topBar = `
        <div class="flex items-center justify-between gap-2 mb-4">
          <button onclick="goHome()" class="inline-flex items-center gap-2 text-xs font-semibold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3.5 py-2 rounded-xl transition active:scale-95">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Menü</span>
          </button>

          <div class="flex items-center gap-1.5 bg-rose-950/50 border border-rose-500/30 px-3 py-1.5 rounded-xl">
            <i data-lucide="skull" class="w-3.5 h-3.5 text-rose-400"></i>
            <span class="text-[11px] font-bold uppercase tracking-wider text-rose-200">Dead by Daylight</span>
          </div>
        </div>
      `;

      if (dbd.phase === 'role') {
        return `
          <div class="animate-pop space-y-4">
            ${topBar}

            <div class="glass-card rounded-3xl p-5 border border-rose-500/30 text-center">
              <h2 class="font-display font-bold text-2xl sm:text-3xl uppercase tracking-wide text-white">
                Wählt eure Rolle für die Runde
              </h2>
              <p class="text-xs text-zinc-400 mt-1">
                Vorhersagen vor dem Start, Live-Tracker im Match & Punkte-Auswertung am Ende.
              </p>
            </div>

            <div class="grid grid-cols-1 gap-3.5">
              <div onclick="selectDbdMode('survivor')" class="glass-card hover:bg-zinc-900/95 border border-cyan-500/40 rounded-3xl p-5 cursor-pointer transition active:scale-[0.98] relative overflow-hidden">
                <div class="flex items-start justify-between gap-3">
                  <div class="flex items-center gap-3.5">
                    <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center shrink-0">
                      <i data-lucide="users" class="w-6 h-6 text-cyan-300"></i>
                    </div>
                    <div>
                      <span class="text-[10px] font-bold uppercase tracking-widest text-cyan-400">Squad / Party Modus</span>
                      <h3 class="font-display font-bold text-2xl text-white uppercase">Survivor</h3>
                      <p class="text-xs text-zinc-400 mt-0.5">Jeder Spieler hat eigene Haken & Stats + eigene Killer-Vorhersage.</p>
                    </div>
                  </div>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-cyan-400 mt-1"></i>
                </div>
              </div>

              <div class="glass-card border border-rose-500/40 rounded-3xl p-5 space-y-3">
                <div class="flex items-center gap-3.5">
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center shrink-0">
                    <i data-lucide="swords" class="w-6 h-6 text-rose-400"></i>
                  </div>
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-rose-400">The Entity</span>
                    <h3 class="font-display font-bold text-2xl text-white uppercase">Killer</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Vorhersagen zu Entkommenen, Gens & Exhaustion Perks.</p>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5 pt-2">
                  <button onclick="selectDbdMode('killer', 'solo')" class="py-3 px-3 rounded-2xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold uppercase tracking-wider transition active:scale-95 flex flex-col items-center gap-1">
                    <span>Solo Komplett</span>
                    <span class="text-[10px] font-normal text-rose-100">Nur du spielst & tippst</span>
                  </button>
                  <button onclick="selectDbdMode('killer', 'spectator')" class="py-3 px-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 border border-rose-500/30 text-rose-200 text-xs font-bold uppercase tracking-wider transition active:scale-95 flex flex-col items-center gap-1">
                    <span>Zuschauer-Wetten</span>
                    <span class="text-[10px] font-normal text-zinc-400">Alle tippen auf deine Runde</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (dbd.phase === 'predict') {
        const participants = getDbdParticipants();
        const isRemoteClient = state.lobby.role === 'client';
        const activePlayer = isRemoteClient
          ? (participants.find(p => p.id === state.lobby.myPlayerId) || participants[0])
          : participants[dbd.activePredictPlayerIndex] || participants[0];

        const targets = getPredictionTargetsFor(activePlayer.id);
        const currentKillerPlayer = getCurrentKillerPlayer();
        const isAlreadyReady = Boolean(dbd.readyPlayers[activePlayer.id]);

        return `
          <div class="animate-pop space-y-4">
            ${topBar}

            <div class="glass-card rounded-3xl p-5 border border-purple-500/30 space-y-4">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold uppercase tracking-widest text-purple-400">
                  Phase 1: Geheime Vorhersagen
                </span>
                ${!isRemoteClient ? `
                  <span class="text-xs font-semibold text-zinc-400">
                    Spieler ${dbd.activePredictPlayerIndex + 1} von ${participants.length}
                  </span>
                ` : ''}
              </div>

              <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="font-display font-bold text-2xl text-white">
                  Tipp von <span class="text-cyan-400">${activePlayer.name}</span>
                </h2>
                ${dbd.mode === 'killer' && currentKillerPlayer ? `
                  <span class="text-xs font-bold px-3 py-1 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300">
                    Killer dieser Runde: ${currentKillerPlayer.name}
                  </span>
                ` : ''}
              </div>

              ${targets.map(target => {
                const pred = getOrCreatePrediction(activePlayer.id, target.id);
                const isSelf = target.id === activePlayer.id;
                const targetHeading = isSelf
                  ? 'Dein eigener Tipp'
                  : `Dein Tipp auf <span class="text-amber-300">${target.name}</span>`;

                return `
                  <div class="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 space-y-4">
                    <p class="text-xs font-bold uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2">
                      ${targetHeading}
                    </p>

                    <div>
                      <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">
                        Welche Map kommt? (+20 Pkt & 1 Shot verteilen)
                      </label>
                      <select
                        onchange="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'map', this.value)"
                        class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-cyan-500"
                      >
                        ${DBD_MAPS.map(m => `
                          <option value="${m}" ${pred.map === m ? 'selected' : ''}>${m}</option>
                        `).join('')}
                      </select>
                    </div>

                    ${dbd.mode === 'survivor' ? `
                      <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">
                          Welcher Killer kommt? (+20 Pkt & 1 Shot verteilen)
                        </label>
                        <select
                          onchange="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'killer', this.value)"
                          class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-purple-500"
                        >
                          ${DBD_KILLERS.map(k => `
                            <option value="${k}" ${pred.killer === k ? 'selected' : ''}>${k}</option>
                          `).join('')}
                        </select>
                      </div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3.5 text-center">
                          <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-2">Skillchecks verfehlt</span>
                          <div class="flex items-center justify-center gap-4">
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'missedChecks', Math.max(0, ${Number(pred.missedChecks)} - 1))" class="w-11 h-11 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-xl active:scale-90">-</button>
                            <span class="font-display font-bold text-2xl text-white w-9">${pred.missedChecks}</span>
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'missedChecks', Math.min(20, ${Number(pred.missedChecks)} + 1))" class="w-11 h-11 rounded-xl bg-purple-600/40 border border-purple-500/40 font-bold text-xl active:scale-90">+</button>
                          </div>
                        </div>

                        <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3.5 text-center">
                          <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-2">Male am Haken (0–3)</span>
                          <div class="flex items-center justify-center gap-4">
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'hooks', Math.max(0, ${Number(pred.hooks)} - 1))" class="w-11 h-11 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-xl active:scale-90">-</button>
                            <span class="font-display font-bold text-2xl text-white w-9">${pred.hooks}</span>
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'hooks', Math.min(3, ${Number(pred.hooks)} + 1))" class="w-11 h-11 rounded-xl bg-purple-600/40 border border-purple-500/40 font-bold text-xl active:scale-90">+</button>
                          </div>
                        </div>
                      </div>
                    ` : `
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3.5 text-center">
                          <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-2">Survivor entkommen (0–4)</span>
                          <div class="flex items-center justify-center gap-4">
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'escaped', Math.max(0, ${Number(pred.escaped)} - 1))" class="w-11 h-11 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-xl active:scale-90">-</button>
                            <span class="font-display font-bold text-2xl text-white w-11">${pred.escaped}/4</span>
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'escaped', Math.min(4, ${Number(pred.escaped)} + 1))" class="w-11 h-11 rounded-xl bg-rose-600/40 border border-rose-500/40 font-bold text-xl active:scale-90">+</button>
                          </div>
                        </div>

                        <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3.5 text-center">
                          <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-2">Gens repariert (0–5)</span>
                          <div class="flex items-center justify-center gap-4">
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'gens', Math.max(0, ${Number(pred.gens)} - 1))" class="w-11 h-11 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-xl active:scale-90">-</button>
                            <span class="font-display font-bold text-2xl text-white w-11">${pred.gens}/5</span>
                            <button onclick="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'gens', Math.min(5, ${Number(pred.gens)} + 1))" class="w-11 h-11 rounded-xl bg-rose-600/40 border border-rose-500/40 font-bold text-xl active:scale-90">+</button>
                          </div>
                        </div>
                      </div>

                      <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">
                          Welcher Exhaustion Perk ist im Match? (+20 Pkt & 1 Shot verteilen)
                        </label>
                        <select
                          onchange="updateDbdPredictionField('${activePlayer.id}', '${target.id}', 'exhaustionPerk', this.value)"
                          class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-rose-500"
                        >
                          ${DBD_EXHAUSTION_PERKS.map(perk => `
                            <option value="${perk.id}" ${pred.exhaustionPerk === perk.id ? 'selected' : ''}>${perk.name}</option>
                          `).join('')}
                        </select>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}

              <div class="pt-2">
                ${isRemoteClient ? (isAlreadyReady ? `
                  <div class="text-center bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-3.5">
                    <p class="text-xs text-emerald-300 font-bold">Du bist BEREIT! Warte bis alle anderen bereit sind...</p>
                  </div>
                ` : `
                  <button onclick="markPlayerDbdReady('${activePlayer.id}')" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-cyan-600 text-white font-bold text-sm uppercase tracking-wider shadow-lg transition active:scale-95">
                    Bereit (Vorhersagen absenden)
                  </button>
                `) : `
                  <button onclick="markPlayerDbdReady('${activePlayer.id}')" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold text-sm uppercase tracking-wider shadow-lg transition active:scale-95">
                    Bereit – ${dbd.activePredictPlayerIndex < participants.length - 1 ? `Weiter zu ${participants[dbd.activePredictPlayerIndex + 1].name}` : 'Runde starten'}
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }

      if (dbd.phase === 'live') {
        const s = dbd.liveStats;
        const canSwitchPlayer = state.lobby.role === 'offline' && state.players.length > 1;
        const activePlayerId = state.lobby.role === 'client' ? state.lobby.myPlayerId : dbd.activeLivePlayerId;
        const activePlayerObj = state.players.find(p => p.id === activePlayerId) || state.players[0];
        const pStats = ensureDbdPlayerStats(activePlayerObj.id);

        return `
          <div class="animate-pop space-y-4">
            ${topBar}

            <div class="glass-card rounded-3xl p-4 border border-emerald-500/30 flex items-center justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                  <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Match läuft live</span>
                </div>
                <h2 class="font-display font-bold text-2xl text-white uppercase mt-0.5">
                  ${dbd.mode === 'survivor' ? 'Survivor Live-Tracker' : 'Killer Live-Tracker'}
                </h2>
              </div>
              <span class="text-xs bg-zinc-900 border border-zinc-700 px-3 py-1.5 rounded-xl font-semibold text-zinc-300">
                ${state.lobby.role !== 'offline' ? 'Schummelschutz aktiv' : 'Tippe Events mit'}
              </span>
            </div>

            ${dbd.mode === 'survivor' ? `
              ${canSwitchPlayer ? `
                <div class="glass-card rounded-2xl p-2.5 border border-zinc-800">
                  <p class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 px-1 mb-2">
                    Aktiver Spieler zum Tippen auswählen:
                  </p>
                  <div class="flex gap-2 overflow-x-auto no-scrollbar">
                    ${state.players.map(p => {
                      const isSel = p.id === activePlayerObj.id;
                      const st = ensureDbdPlayerStats(p.id);
                      return `
                        <button onclick="setActiveLivePlayer('${p.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-2 ${
                          isSel
                            ? 'bg-gradient-to-r from-cyan-600 to-purple-600 text-white shadow-lg'
                            : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                        }">
                          <span>${p.name}</span>
                          <span class="text-[10px] px-1.5 py-0.5 rounded bg-black/30">${st.hooks}/3 Haken</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : ''}

              <div class="text-xs text-zinc-400 px-1 flex items-center justify-between">
                <span>Stats für: <strong class="text-cyan-400">${activePlayerObj.name}</strong></span>
                <span>Punkte: <strong class="text-emerald-400">${(pStats.stunsBlinds + pStats.healsUnhooks) * 10}</strong></span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="triggerDbdLiveEvent('missedCheck', '${activePlayerObj.id}')" class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+1 Shot</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Skillcheck verfehlt</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Generator explodiert / Heal fail</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${pStats.missedChecks}</span>
                    <span class="text-[9px] text-rose-300 uppercase">Mal</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('hook', '${activePlayerObj.id}')" ${pStats.hooks >= 3 ? 'disabled' : ''} class="glass-card ${pStats.hooks >= 3 ? 'opacity-60' : 'hover:bg-rose-950/30 active:scale-95'} border border-rose-500/40 rounded-3xl p-4 text-left transition flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">
                      ${pStats.hooks === 2 ? 'Nächster = TOD (+3 Shots)' : pStats.hooks >= 3 ? 'TOT (3/3)' : '+1 Shot'}
                    </span>
                    <h3 class="font-bold text-base text-white mt-0.5">Am Haken</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">1. & 2. = 1 Shot | 3. (Tod) = 3 Shots</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${pStats.hooks}/3</span>
                    <span class="text-[9px] text-rose-300 uppercase">Haken</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('stunBlind', '${activePlayerObj.id}')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+10 Punkte</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Killer gestunt / geblendet</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Palette, Flashlight, Head On</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${pStats.stunsBlinds}</span>
                    <span class="text-[9px] text-emerald-300 uppercase">Mal</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('healUnhook', '${activePlayerObj.id}')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+10 Punkte</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Geheilt / Vom Haken gerettet</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Safe Unhook oder Full Heal</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${pStats.healsUnhooks}</span>
                    <span class="text-[9px] text-emerald-300 uppercase">Mal</span>
                  </div>
                </button>
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="triggerDbdLiveEvent('genRepaired')" ${s.gensRepaired >= 5 ? 'disabled' : ''} class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+1 Shot</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Gen repariert</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Survivor haben einen Gen fertig</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${s.gensRepaired}/5</span>
                    <span class="text-[9px] text-rose-300 uppercase">Gens</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('survHooked')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+5 Punkte</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Survivor angehakt</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Jeder Hook zählt (+5 Pkt)</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${s.survivorsHooked}</span>
                    <span class="text-[9px] text-emerald-300 uppercase">Hooks</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('survKilled')" ${s.survivorsKilled >= 4 ? 'disabled' : ''} class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+10 Punkte</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Survivor gekillt</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Opferung / Mori (max. 4)</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${s.survivorsKilled}/4</span>
                    <span class="text-[9px] text-emerald-300 uppercase">Kills</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('killerStunned')" class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+2 Shots jeweils</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Stun / Blind kassiert</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Palette abbekommen / geblendet</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${s.killerStunnedBlinded}</span>
                    <span class="text-[9px] text-rose-300 uppercase">Mal</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('survEscaped')" ${s.survivorsEscaped >= 4 ? 'disabled' : ''} class="sm:col-span-2 glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-4 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+1 Shot pro Survivor</span>
                    <h3 class="font-bold text-base text-white mt-0.5">Entkommene Survivor</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Durch Ausgangstor oder Luke entkommen</p>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex flex-col items-center justify-center">
                    <span class="font-display font-bold text-xl text-white">${s.survivorsEscaped}/4</span>
                    <span class="text-[9px] text-rose-300 uppercase">Raus</span>
                  </div>
                </button>
              </div>
            `}

            ${state.lobby.role !== 'client' ? `
              <div class="pt-2">
                <button onclick="goToDbdReview()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-400 hover:to-rose-500 text-white font-display font-bold text-lg uppercase tracking-wider shadow-xl transition active:scale-95">
                  Runde vorbei – Zur Übersicht & Auswertung
                </button>
              </div>
            ` : `
              <p class="text-center text-xs text-zinc-500 pt-2">Der Host beendet die Runde sobald das Match vorbei ist.</p>
            `}
          </div>
        `;
      }

      if (dbd.phase === 'review') {
        const s = dbd.liveStats;
        const actual = dbd.actualOutcome;
        const isRemoteClient = state.lobby.role === 'client';
        const myReviewId = isRemoteClient ? state.lobby.myPlayerId : (state.players[0]?.id || '');
        const isMyReviewReady = Boolean(dbd.reviewReadyPlayers[myReviewId]);
        const reviewParticipants = state.lobby.role !== 'offline'
          ? state.players.filter(p => p.id === myReviewId)
          : getDbdParticipants();

        return `
          <div class="animate-pop space-y-4">
            ${topBar}

            <div class="glass-card rounded-3xl p-5 border border-amber-500/30 space-y-4">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-widest text-amber-400">Runden-Check & Korrektur</span>
                <h2 class="font-display font-bold text-2xl text-white uppercase">Eigene Stats prüfen & Auflösung eintragen</h2>
                <p class="text-xs text-zinc-400">Jeder prüft nur seine eigenen Werte und bestätigt am Ende fürs gemeinsame Leaderboard.</p>
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">
                  Welche Map war es wirklich?
                </label>
                <select
                  onchange="state.dbd.actualOutcome.map = this.value"
                  class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-amber-500"
                >
                  ${DBD_MAPS.map(m => `
                    <option value="${m}" ${actual.map === m ? 'selected' : ''}>${m}</option>
                  `).join('')}
                </select>
              </div>

              ${dbd.mode === 'survivor' ? `
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">
                    Welcher Killer war es wirklich?
                  </label>
                  <select
                    onchange="state.dbd.actualOutcome.killer = this.value"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    ${DBD_KILLERS.map(k => `
                      <option value="${k}" ${actual.killer === k ? 'selected' : ''}>${k}</option>
                    `).join('')}
                  </select>
                </div>

                <div class="space-y-3 pt-1">
                  ${reviewParticipants.map(p => {
                    const pStats = ensureDbdPlayerStats(p.id);
                    return `
                      <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3.5 space-y-2.5">
                        <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                          <span class="font-bold text-sm text-cyan-300">${p.name}</span>
                          <span class="text-[11px] text-zinc-400">Eigene Runden-Stats</span>
                        </div>

                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Skillchecks verfehlt</span>
                          <div class="flex items-center gap-2.5">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'missedChecks', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.missedChecks}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'missedChecks', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>

                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Male am Haken (0–3)</span>
                          <div class="flex items-center gap-2.5">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'hooks', -1, 0, 3)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.hooks}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'hooks', 1, 0, 3)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>

                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Killer gestunt / geblendet</span>
                          <div class="flex items-center gap-2.5">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'stunsBlinds', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.stunsBlinds}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'stunsBlinds', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>

                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Geheilt / Vom Haken gerettet</span>
                          <div class="flex items-center gap-2.5">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'healsUnhooks', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.healsUnhooks}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'healsUnhooks', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : `
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1.5">
                    Welcher Exhaustion Perk war drin?
                  </label>
                  <select
                    onchange="state.dbd.actualOutcome.exhaustionPerk = this.value"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    ${DBD_EXHAUSTION_PERKS.map(perk => `
                      <option value="${perk.id}" ${actual.exhaustionPerk === perk.id ? 'selected' : ''}>${perk.name}</option>
                    `).join('')}
                  </select>
                </div>

                <div class="space-y-2.5 pt-2">
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2.5 rounded-2xl">
                    <span class="text-xs font-semibold text-zinc-200">Gens repariert (0–5)</span>
                    <div class="flex items-center gap-3">
                      <button onclick="adjustReviewGlobalStat('gensRepaired', -1, 0, 5)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">-</button>
                      <span class="font-display font-bold text-lg w-8 text-center">${s.gensRepaired}</span>
                      <button onclick="adjustReviewGlobalStat('gensRepaired', 1, 0, 5)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2.5 rounded-2xl">
                    <span class="text-xs font-semibold text-zinc-200">Survivor angehakt</span>
                    <div class="flex items-center gap-3">
                      <button onclick="adjustReviewGlobalStat('survivorsHooked', -1, 0, 12)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">-</button>
                      <span class="font-display font-bold text-lg w-8 text-center">${s.survivorsHooked}</span>
                      <button onclick="adjustReviewGlobalStat('survivorsHooked', 1, 0, 12)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2.5 rounded-2xl">
                    <span class="text-xs font-semibold text-zinc-200">Survivor gekillt (0–4)</span>
                    <div class="flex items-center gap-3">
                      <button onclick="adjustReviewGlobalStat('survivorsKilled', -1, 0, 4)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">-</button>
                      <span class="font-display font-bold text-lg w-8 text-center">${s.survivorsKilled}</span>
                      <button onclick="adjustReviewGlobalStat('survivorsKilled', 1, 0, 4)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2.5 rounded-2xl">
                    <span class="text-xs font-semibold text-zinc-200">Stun / Blind kassiert</span>
                    <div class="flex items-center gap-3">
                      <button onclick="adjustReviewGlobalStat('killerStunnedBlinded', -1, 0, 50)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">-</button>
                      <span class="font-display font-bold text-lg w-8 text-center">${s.killerStunnedBlinded}</span>
                      <button onclick="adjustReviewGlobalStat('killerStunnedBlinded', 1, 0, 50)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2.5 rounded-2xl">
                    <span class="text-xs font-semibold text-zinc-200">Entkommene Survivor (0–4)</span>
                    <div class="flex items-center gap-3">
                      <button onclick="adjustReviewGlobalStat('survivorsEscaped', -1, 0, 4)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">-</button>
                      <span class="font-display font-bold text-lg w-8 text-center">${s.survivorsEscaped}</span>
                      <button onclick="adjustReviewGlobalStat('survivorsEscaped', 1, 0, 4)" class="w-8 h-8 rounded-xl bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                </div>
              `}

              ${isMyReviewReady ? `
                <div class="text-center bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-3.5">
                  <p class="text-xs text-emerald-300 font-bold">Ergebnis bestätigt! Leaderboard erscheint sobald alle fertig sind...</p>
                </div>
              ` : `
                <button onclick="confirmDbdReviewForPlayer('${myReviewId}')" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-600 hover:from-emerald-400 hover:to-cyan-500 text-white font-display font-bold text-lg uppercase tracking-wider shadow-xl transition active:scale-95">
                  Ergebnis bestätigen & Leaderboard öffnen
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (dbd.phase === 'leaderboard') {
        const results = dbd.results || [];
        const maxShots = results.reduce((max, r) => Math.max(max, r.shots), 0);

        return `
          <div class="animate-pop space-y-4">
            ${topBar}

            <div class="glass-card rounded-3xl p-5 border border-amber-500/30 text-center">
              <span class="text-[11px] font-bold uppercase tracking-widest text-amber-400">Runden-Auswertung</span>
              <h2 class="font-display font-bold text-3xl text-white uppercase mt-0.5">Leaderboard</h2>
              <p class="text-xs text-zinc-400 mt-1">
                Sortiert nach verdienten Punkten • Shots wurden dem Squad-Pegel gutgeschrieben!
              </p>
            </div>

            <div class="space-y-3.5 pt-1">
              ${results.map((res, idx) => {
                const isTopDrinker = maxShots > 0 && res.shots === maxShots;
                const rankColor = idx === 0 ? 'from-amber-500 to-yellow-600 text-black' : idx === 1 ? 'from-zinc-300 to-zinc-500 text-black' : 'from-zinc-800 to-zinc-900 text-zinc-300';

                return `
                  <div class="relative glass-card rounded-3xl p-4 border ${idx === 0 ? 'border-amber-500/50' : 'border-zinc-800'}">
                    ${isTopDrinker ? `
                      <div class="sticker-badge absolute -top-3 -right-2 z-20 bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 text-zinc-950 font-display font-extrabold text-[11px] uppercase tracking-wider px-3 py-1 rounded-full shadow-lg border-2 border-zinc-950 flex items-center gap-1">
                        <span>Meiste Shots (${res.shots})</span>
                      </div>
                    ` : ''}

                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br ${rankColor} flex items-center justify-center font-display font-extrabold text-lg shrink-0">
                          #${idx + 1}
                        </div>
                        <div>
                          <h3 class="font-bold text-base text-white">${res.name}</h3>
                          <div class="flex items-center gap-3 mt-0.5">
                            <span class="text-xs font-bold text-emerald-400">${res.points} Punkte</span>
                            <span class="text-xs font-bold text-rose-400">${res.shots} ${res.shots === 1 ? 'Shot' : 'Shots'}</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="mt-3 pt-2.5 border-t border-zinc-800/80 space-y-1">
                      ${res.breakdown.map(line => `
                        <p class="text-[11px] text-zinc-400 leading-snug">• ${line}</p>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
              <button onclick="resetDbdMatch('role', true)" class="py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg transition active:scale-95">
                Neue Runde (Killer rotiert)
              </button>
              <button onclick="goHome()" class="py-3.5 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 font-bold text-xs uppercase tracking-wider transition active:scale-95">
                Hauptmenü
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 10. STANDARD GAME VIEW (ALLE ANDEREN GAMES)
    // =========================================================================
    function renderGameView() {
      const game = getActiveGame();
      if (!game) return renderHubView();

      const backAction = state.selectedFranchiseId
        ? `openGameOrFranchise('${state.selectedFranchiseId}')`
        : `goHome()`;

      const intensities = [
        { id: 'chill', label: 'Chill', color: 'text-cyan-400 border-cyan-500/40 bg-cyan-500/10' },
        { id: 'normal', label: 'Normal', color: 'text-purple-400 border-purple-500/40 bg-purple-500/10' },
        { id: 'hardcore', label: 'Hardcore', color: 'text-rose-400 border-rose-500/40 bg-rose-500/10' }
      ];

      return `
        <div class="space-y-4 animate-pop">
          <div class="flex items-center justify-between gap-2">
            <button onclick="${backAction}" class="inline-flex items-center gap-2 text-xs font-semibold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3.5 py-2 rounded-xl transition active:scale-95">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>Zurück</span>
            </button>

            <div class="flex items-center gap-1 bg-zinc-900/90 border border-zinc-800 p-1 rounded-xl">
              ${intensities.map(lvl => {
                const active = state.intensity === lvl.id;
                return `
                  <button
                    onclick="setIntensity('${lvl.id}')"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                      active ? lvl.color + ' border' : 'text-zinc-500 hover:text-zinc-300'
                    }">
                    ${lvl.label}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="glass-card rounded-3xl p-5 border border-zinc-800 relative overflow-hidden">
            <div class="absolute -right-8 -top-8 w-32 h-32 bg-purple-600/20 rounded-full blur-2xl"></div>
            <span class="text-[10px] font-bold uppercase tracking-widest text-cyan-400">${game.tag || game.badge || 'Active Session'}</span>
            <h2 class="font-display font-bold text-2xl sm:text-3xl text-white uppercase tracking-wide mt-0.5">
              ${game.title}
            </h2>
          </div>

          ${state.pendingDrink ? `
            <div class="glass-card rounded-3xl p-4 border-2 border-amber-500/60 bg-amber-950/20 animate-pop space-y-3">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400">
                    +${state.pendingDrink.sips} ${state.pendingDrink.sips === 1 ? 'Schluck' : 'Schlucke'} verbuchen für:
                  </span>
                  <p class="text-xs text-zinc-200 font-medium mt-0.5">„${state.pendingDrink.text}“</p>
                </div>
                <button onclick="dismissPendingDrink()" class="text-zinc-400 hover:text-white p-1">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="flex flex-wrap gap-2">
                ${state.players.map(p => `
                  <button
                    onclick="assignPendingDrink('${p.id}')"
                    class="px-3 py-2 rounded-xl bg-zinc-900 hover:bg-amber-500/20 border border-zinc-700 hover:border-amber-500/50 text-xs font-semibold text-white transition active:scale-95">
                    ${p.name}
                  </button>
                `).join('')}
                <button
                  onclick="assignPendingDrink('ALL')"
                  class="px-3 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-xs font-bold text-white shadow-lg transition active:scale-95">
                  Alle zusammen!
                </button>
              </div>
            </div>
          ` : ''}

          <div class="grid grid-cols-2 gap-2 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800">
            <button
              onclick="setActiveTab('rules')"
              class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition ${
                state.activeTab === 'rules'
                  ? 'bg-zinc-800 text-white shadow'
                  : 'text-zinc-500 hover:text-zinc-300'
              }">
              <i data-lucide="list-checks" class="w-4 h-4 text-purple-400"></i>
              <span>Live-Regeln</span>
            </button>
            <button
              onclick="setActiveTab('cards')"
              class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition ${
                state.activeTab === 'cards'
                  ? 'bg-zinc-800 text-white shadow'
                  : 'text-zinc-500 hover:text-zinc-300'
              }">
              <i data-lucide="layers" class="w-4 h-4 text-cyan-400"></i>
              <span>Karten-Deck</span>
            </button>
          </div>

          ${state.activeTab === 'rules' ? `
            <div class="space-y-2.5">
              ${(game.rules || []).map(rule => {
                const scaled = getScaledSips(rule.sips);
                let badgeStyle = 'bg-purple-500/20 text-purple-300 border-purple-500/30';
                let label = `${scaled} ${scaled === 1 ? 'Schluck' : 'Schlucke'}`;

                if (rule.type === 'reward') {
                  badgeStyle = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
                  label = `Verteile ${scaled}`;
                } else if (rule.type === 'extreme') {
                  badgeStyle = 'bg-rose-500/20 text-rose-300 border-rose-500/30';
                  label = `${scaled} Schlucke!`;
                }

                return `
                  <div
                    onclick="triggerRule(${rule.sips}, '${rule.event.replace(/'/g, "\\'")}')"
                    class="glass-card hover:bg-zinc-900/90 border border-zinc-800/90 hover:border-zinc-700 rounded-2xl p-4 flex items-center justify-between gap-3 cursor-pointer transition active:scale-[0.98]"
                  >
                    <p class="text-sm text-zinc-100 font-medium leading-snug flex-1">
                      ${rule.event}
                    </p>
                    <span class="px-3 py-1.5 rounded-xl border text-xs font-bold whitespace-nowrap shrink-0 ${badgeStyle}">
                      ${label}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="space-y-4">
              <div class="glass-card rounded-3xl p-6 border border-cyan-500/30 min-h-[210px] flex flex-col items-center justify-center text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-purple-600/10 via-transparent to-cyan-600/10"></div>
                ${state.currentCard ? `
                  <div class="relative z-10 animate-pop space-y-3">
                    <span class="inline-block px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-[10px] font-bold uppercase tracking-widest">
                      ${game.title} Karte
                    </span>
                    <p class="text-lg sm:text-xl font-bold text-white leading-relaxed">
                      ${state.currentCard}
                    </p>
                  </div>
                ` : `
                  <div class="relative z-10 space-y-2">
                    <i data-lucide="sparkles" class="w-9 h-9 text-cyan-400 mx-auto opacity-80"></i>
                    <p class="text-sm text-zinc-400">
                      Zieht reihum eine Karte für spontane Challenges & Regeln!
                    </p>
                  </div>
                `}
              </div>

              <button
                onclick="drawRandomCard()"
                class="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 hover:opacity-95 text-white font-display font-bold text-lg uppercase tracking-wider shadow-xl shadow-purple-900/30 transition active:scale-95 flex items-center justify-center gap-2"
              >
                <i data-lucide="shuffle" class="w-5 h-5"></i>
                <span>${state.currentCard ? 'Nächste Karte ziehen' : 'Erste Karte ziehen'}</span>
              </button>
            </div>
          `}
        </div>
      `;
    }

    // Initial Render
    render();
  </script>
</body>
</html>
