    function renderProfileView() {
      const roundsPlayed = state.profileArchive.length;
      const myPlayer = state.players.find(p => p.id === state.lobby.myPlayerId) || state.players[0];
      const shotsDrunk = myPlayer ? Number(myPlayer.sips) || 0 : 0;

      const modeCounts = {};
      state.profileArchive.forEach(entry => {
        modeCounts[entry.mode] = (modeCounts[entry.mode] || 0) + 1;
      });
      let mostPlayed = 'Dead by Daylight';
      let topCount = 0;
      Object.keys(modeCounts).forEach(m => {
        if (modeCounts[m] > topCount) {
          topCount = modeCounts[m];
          mostPlayed = `DBD · ${m}`;
        }
      });

      return `
        <div class="space-y-4 animate-pop">
          <div class="flex items-center justify-between gap-2">
            <button onclick="goHome()" class="inline-flex items-center gap-2 text-xs font-semibold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3.5 py-2 rounded-xl transition active:scale-95">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>Zurück</span>
            </button>
          </div>

          <!-- Profil Banner -->
          <div class="glass-card rounded-3xl p-5 border border-purple-500/30 space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center shadow-lg">
                <i data-lucide="user-check" class="w-6 h-6 text-white"></i>
              </div>
              <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-purple-400">Spieler-Banner</span>
                <h2 class="font-display font-bold text-2xl text-white uppercase tracking-wide">
                  Profil · ${myPlayer ? myPlayer.name : 'Spieler'}
                </h2>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3">
                <span class="block text-[10px] uppercase tracking-wider text-zinc-400">Runden gespielt</span>
                <span class="font-display font-bold text-xl text-white mt-0.5 block">${roundsPlayed}</span>
              </div>
              <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3">
                <span class="block text-[10px] uppercase tracking-wider text-zinc-400">Shots getrunken</span>
                <span class="font-display font-bold text-xl text-rose-400 mt-0.5 block">${shotsDrunk}</span>
              </div>
              <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3">
                <span class="block text-[10px] uppercase tracking-wider text-zinc-400">Meist gespielt</span>
                <span class="font-bold text-xs text-cyan-300 mt-1.5 block truncate">${mostPlayed}</span>
              </div>
            </div>
          </div>

          <!-- Archiv -->
          <div class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <h3 class="font-display font-bold text-lg uppercase tracking-wider text-white">Runden-Archiv</h3>
              <span class="text-xs text-zinc-400">${roundsPlayed} Einträge</span>
            </div>

            ${state.profileArchive.length === 0 ? `
              <div class="glass-card rounded-3xl p-6 border border-zinc-800 text-center">
                <p class="text-xs text-zinc-400">Noch keine beendeten Runden im Archiv. Spiele eine Runde Dead by Daylight!</p>
              </div>
            ` : state.profileArchive.map(entry => {
              const isOpen = selectedArchiveEntryId === entry.id;
              return `
                <div class="glass-card rounded-2xl border border-zinc-800 overflow-hidden">
                  <button
                    onclick="toggleArchiveEntry('${entry.id}')"
                    class="w-full px-4 py-3.5 flex items-center justify-between text-left hover:bg-zinc-900/70 transition"
                  >
                    <span class="font-bold text-sm text-white">[${entry.dateTime}]</span>
                    <span class="text-xs text-zinc-400 flex items-center gap-1.5">
                      <span>${entry.mode}</span>
                      <i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4 text-zinc-400"></i>
                    </span>
                  </button>

                  ${isOpen ? `
                    <div class="px-4 pb-4 pt-2 border-t border-zinc-800/80 space-y-2 animate-pop">
                      <div class="flex items-center justify-between text-xs">
                        <span class="text-zinc-400">Spiel</span>
                        <span class="font-bold text-white">${entry.gameName}</span>
                      </div>
                      <div class="flex items-center justify-between text-xs">
                        <span class="text-zinc-400">Modus</span>
                        <span class="font-bold text-cyan-300">${entry.mode}</span>
                      </div>
                      <div class="pt-1.5 space-y-1">
                        <p class="text-[11px] font-bold uppercase tracking-wider text-amber-400">Leaderboard</p>
                        ${(entry.leaderboard || []).map(row => `
                          <div class="flex items-center justify-between bg-zinc-950/80 border border-zinc-800/80 rounded-xl px-3 py-2 text-xs">
                            <span class="font-semibold text-zinc-200">#${row.rank} ${row.name}</span>
                            <span class="font-bold text-rose-400">${row.shots} ${row.shots === 1 ? 'Shot' : 'Shots'}</span>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      updatePlayerBadge();
      updateLobbyBadge();
      const container = document.getElementById('app-container');

      if (!state.hasSetInitialName || state.players.length === 0) {
        container.innerHTML = renderInitialNameView();
        safeCreateIcons();
        return;
      }

      if (state.view === 'hub') {
        container.innerHTML = renderHubView();
      } else if (state.view === 'profile') {
        container.innerHTML = renderProfileView();
      } else if (state.view === 'game') {
        container.innerHTML = renderDbdView();
      }
      safeCreateIcons();
    }

    function renderInitialNameView() {
      return `
        <div class="max-w-md mx-auto pt-6 animate-pop">
          <div class="glass-card rounded-3xl p-6 border border-purple-500/30 space-y-5">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center shadow-lg">
              <i data-lucide="user-plus" class="w-6 h-6 text-white"></i>
            </div>
            <div>
              <span class="text-[10px] font-bold uppercase tracking-widest text-purple-400">Willkommen bei DrinkHub</span>
              <h2 class="font-display font-bold text-2xl text-white uppercase mt-1">Wie heißt du?</h2>
              <p class="text-xs text-zinc-400 mt-1">
                Lege deinen Spielernamen fest. Du kannst ihn jederzeit oben über den Squad-Button ändern oder ergänzen.
              </p>
            </div>
            <form onsubmit="setInitialPlayerName(event)" class="space-y-3">
              <input
                id="initial-name-input"
                type="text"
                maxlength="18"
                placeholder="Dein Name..."
                required
                class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500"
              />
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 text-white font-display font-bold text-base uppercase tracking-wider shadow-lg transition active:scale-95">
                Los geht's
              </button>
            </form>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. DEAD BY DAYLIGHT UI (MOBILE-FIRST STEP-BY-STEP FLOW)
    // =========================================================================
    function renderDbdView() {
      const dbd = state.dbd;

      const topBar = `
        <div class="flex items-center justify-between gap-2 mb-3">
          <button onclick="goHome()" class="inline-flex items-center gap-2 text-xs font-semibold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3.5 py-2 rounded-xl transition active:scale-95">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Menü</span>
          </button>

          <div class="flex items-center gap-1.5 bg-rose-950/50 border border-rose-500/30 px-3 py-1.5 rounded-xl">
            <i data-lucide="skull" class="w-3.5 h-3.5 text-rose-400"></i>
            <span class="text-[11px] font-bold uppercase tracking-wider text-rose-200">Dead by Daylight</span>
          </div>
        </div>
      `;

      if (dbd.phase === 'role') {
        return `
          <div class="animate-pop space-y-3.5">
            ${topBar}

            <div class="glass-card rounded-3xl p-4 sm:p-5 border border-rose-500/30 text-center">
              <h2 class="font-display font-bold text-2xl sm:text-3xl uppercase tracking-wide text-white">
                Wählt eure Rolle für die Runde
              </h2>
              <p class="text-xs text-zinc-400 mt-1">
                Vorhersagen vor dem Start, Live-Tracker im Match & Punkte-Auswertung am Ende.
              </p>
            </div>

            <div class="grid grid-cols-1 gap-3">
              <div onclick="selectDbdMode('survivor')" class="glass-card hover:bg-zinc-900/95 border border-cyan-500/40 rounded-3xl p-4 sm:p-5 cursor-pointer transition active:scale-[0.98] flex items-center justify-between gap-3">
                <div class="flex items-center gap-3.5">
                  <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center shrink-0">
                    <i data-lucide="users" class="w-6 h-6 text-cyan-300"></i>
                  </div>
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-cyan-400">Squad / Party Modus</span>
                    <h3 class="font-display font-bold text-2xl text-white uppercase">Survivor</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Tipps nacheinander auf Mitspieler + Map & Killer.</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-cyan-400 shrink-0"></i>
              </div>

              <div class="glass-card border border-rose-500/40 rounded-3xl p-4 sm:p-5 space-y-3">
                <div class="flex items-center gap-3.5">
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center shrink-0">
                    <i data-lucide="swords" class="w-6 h-6 text-rose-400"></i>
                  </div>
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-rose-400">The Entity</span>
                    <h3 class="font-display font-bold text-2xl text-white uppercase">Killer</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">Solo oder Zuschauer-Wetten auf Gens, Entkommene & Perks.</p>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5 pt-1">
                  <button onclick="selectDbdMode('killer', 'solo')" class="py-3 px-3 rounded-2xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold uppercase tracking-wider transition active:scale-95 flex flex-col items-center gap-1">
                    <span>Solo Komplett</span>
                    <span class="text-[10px] font-normal text-rose-100">Nur du spielst & tippst</span>
                  </button>
                  <button onclick="selectDbdMode('killer', 'spectator')" class="py-3 px-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 border border-rose-500/30 text-rose-200 text-xs font-bold uppercase tracking-wider transition active:scale-95 flex flex-col items-center gap-1">
                    <span>Zuschauer-Wetten</span>
                    <span class="text-[10px] font-normal text-zinc-400">Alle tippen auf deine Runde</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (dbd.phase === 'predict') {
        const participants = getDbdParticipants();
        const isRemoteClient = state.lobby.role === 'client';
        const activePlayer = isRemoteClient
          ? (participants.find(p => p.id === state.lobby.myPlayerId) || participants[0])
          : participants[dbd.activePredictPlayerIndex] || participants[0];

        const targets = getPredictionTargetsFor(activePlayer.id);
        const safeStep = Math.min(dbd.activeTargetStep || 0, Math.max(0, targets.length - 1));
        const currentTarget = targets[safeStep] || activePlayer;
        const pred = getOrCreatePrediction(activePlayer.id, currentTarget.id);
        const isAlreadyReady = Boolean(dbd.readyPlayers[activePlayer.id]);
        const isSelf = currentTarget.id === activePlayer.id;

        const readyCount = participants.filter(p => Boolean(dbd.readyPlayers[p.id])).length;

        const targetLabel = isSelf
          ? 'Dein eigener Tipp'
          : `Dein Tipp auf ${currentTarget.name}`;

        const nextActionText = safeStep < targets.length - 1
          ? `Weiter (${safeStep + 1}/${targets.length})`
          : (isRemoteClient ? 'Bereit' : (dbd.activePredictPlayerIndex < participants.length - 1 ? `Bereit · Nächster Spieler` : 'Bereit · Runde starten'));

        return `
          <div class="animate-pop space-y-3">
            ${topBar}

            <div class="glass-card rounded-3xl p-4 sm:p-5 border border-purple-500/30 space-y-3.5">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">
                  ${activePlayer.name}
                </span>
                <span class="text-[11px] font-semibold text-zinc-400 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full">
                  Bereit: ${readyCount}/${participants.length}
                </span>
              </div>

              ${isRemoteClient && isAlreadyReady ? `
                <div class="text-center bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-4 space-y-1">
                  <p class="text-sm text-emerald-300 font-bold">Du bist Bereit!</p>
                  <p class="text-xs text-zinc-400">Warte bis alle anderen Spieler auf Bereit geklickt haben (${readyCount}/${participants.length})...</p>
                </div>
              ` : `
                <div class="bg-zinc-900/85 border border-zinc-800 rounded-2xl p-3.5 space-y-3">
                  <div class="flex items-center justify-between">
                    <h2 class="font-display font-bold text-xl text-amber-300 uppercase">${targetLabel}</h2>
                    ${targets.length > 1 ? `<span class="text-[11px] text-zinc-400">${safeStep + 1} / ${targets.length}</span>` : ''}
                  </div>

                  ${dbd.mode === 'survivor' ? `
                    <div class="grid grid-cols-2 gap-2.5">
                      <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3 text-center">
                        <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-1.5">Skillchecks</span>
                        <div class="flex items-center justify-center gap-3">
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'missedChecks', Math.max(0, ${Number(pred.missedChecks)} - 1))" class="w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-lg active:scale-90">-</button>
                          <span class="font-display font-bold text-2xl text-white w-7">${pred.missedChecks}</span>
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'missedChecks', Math.min(20, ${Number(pred.missedChecks)} + 1))" class="w-10 h-10 rounded-xl bg-purple-600/40 border border-purple-500/40 font-bold text-lg active:scale-90">+</button>
                        </div>
                      </div>

                      <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3 text-center">
                        <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-1.5">Haken (0–3)</span>
                        <div class="flex items-center justify-center gap-3">
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'hooks', Math.max(0, ${Number(pred.hooks)} - 1))" class="w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-lg active:scale-90">-</button>
                          <span class="font-display font-bold text-2xl text-white w-7">${pred.hooks}</span>
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'hooks', Math.min(3, ${Number(pred.hooks)} + 1))" class="w-10 h-10 rounded-xl bg-purple-600/40 border border-purple-500/40 font-bold text-lg active:scale-90">+</button>
                        </div>
                      </div>
                    </div>
                  ` : `
                    <div class="grid grid-cols-2 gap-2.5">
                      <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3 text-center">
                        <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-1.5">Entkommen (0–4)</span>
                        <div class="flex items-center justify-center gap-3">
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'escaped', Math.max(0, ${Number(pred.escaped)} - 1))" class="w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-lg active:scale-90">-</button>
                          <span class="font-display font-bold text-xl text-white w-9">${pred.escaped}/4</span>
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'escaped', Math.min(4, ${Number(pred.escaped)} + 1))" class="w-10 h-10 rounded-xl bg-rose-600/40 border border-rose-500/40 font-bold text-lg active:scale-90">+</button>
                        </div>
                      </div>

                      <div class="bg-zinc-950/90 border border-zinc-800 rounded-2xl p-3 text-center">
                        <span class="block text-[11px] font-bold uppercase text-zinc-400 mb-1.5">Gens (0–5)</span>
                        <div class="flex items-center justify-center gap-3">
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'gens', Math.max(0, ${Number(pred.gens)} - 1))" class="w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 font-bold text-lg active:scale-90">-</button>
                          <span class="font-display font-bold text-xl text-white w-9">${pred.gens}/5</span>
                          <button onclick="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'gens', Math.min(5, ${Number(pred.gens)} + 1))" class="w-10 h-10 rounded-xl bg-rose-600/40 border border-rose-500/40 font-bold text-lg active:scale-90">+</button>
                        </div>
                      </div>
                    </div>
                  `}
                </div>

                <!-- Allgemeine Vorhersage -->
                <div class="bg-zinc-900/85 border border-zinc-800 rounded-2xl p-3.5 space-y-2.5">
                  <p class="text-[11px] font-bold uppercase tracking-wider text-purple-300">Allgemeine Vorhersage</p>
                  <div class="grid grid-cols-1 ${dbd.mode === 'survivor' ? 'sm:grid-cols-2' : 'sm:grid-cols-2'} gap-2.5">
                    <div>
                      <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Map</label>
                      <select
                        onchange="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'map', this.value)"
                        class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500"
                      >
                        ${DBD_MAPS.map(m => `
                          <option value="${m}" ${pred.map === m ? 'selected' : ''}>${m}</option>
                        `).join('')}
                      </select>
                    </div>

                    ${dbd.mode === 'survivor' ? `
                      <div>
                        <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Killer</label>
                        <select
                          onchange="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'killer', this.value)"
                          class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"
                        >
                          ${DBD_KILLERS.map(k => `
                            <option value="${k}" ${pred.killer === k ? 'selected' : ''}>${k}</option>
                          `).join('')}
                        </select>
                      </div>
                    ` : `
                      <div>
                        <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Exhaustion Perk</label>
                        <select
                          onchange="updateDbdPredictionField('${activePlayer.id}', '${currentTarget.id}', 'exhaustionPerk', this.value)"
                          class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-rose-500"
                        >
                          ${DBD_EXHAUSTION_PERKS.map(perk => `
                            <option value="${perk.id}" ${pred.exhaustionPerk === perk.id ? 'selected' : ''}>${perk.name}</option>
                          `).join('')}
                        </select>
                      </div>
                    `}
                  </div>
                </div>

                <button
                  onclick="advancePredictionOrReady('${activePlayer.id}', ${targets.length})"
                  class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 text-white font-display font-bold text-base uppercase tracking-wider shadow-lg transition active:scale-95"
                >
                  ${nextActionText}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (dbd.phase === 'live') {
        const s = dbd.liveStats;
        const canSwitchPlayer = state.lobby.role === 'offline' && state.players.length > 1;
        const activePlayerId = state.lobby.role === 'client' ? state.lobby.myPlayerId : dbd.activeLivePlayerId;
        const activePlayerObj = state.players.find(p => p.id === activePlayerId) || state.players[0];
        const pStats = ensureDbdPlayerStats(activePlayerObj.id);

        return `
          <div class="animate-pop space-y-3">
            ${topBar}

            <div class="glass-card rounded-3xl p-4 border border-emerald-500/30 flex items-center justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Match läuft live</span>
                </div>
                <h2 class="font-display font-bold text-2xl text-white uppercase mt-0.5">
                  ${dbd.mode === 'survivor' ? 'Survivor Live' : 'Killer Live'}
                </h2>
              </div>
              <span class="text-xs bg-zinc-900 border border-zinc-700 px-3 py-1.5 rounded-xl font-semibold text-zinc-300">
                ${state.lobby.role !== 'offline' ? 'Eigenes Gerät' : 'Schnell-Tracker'}
              </span>
            </div>

            ${dbd.mode === 'survivor' ? `
              ${canSwitchPlayer ? `
                <div class="glass-card rounded-2xl p-2 border border-zinc-800">
                  <div class="flex gap-2 overflow-x-auto no-scrollbar">
                    ${state.players.map(p => {
                      const isSel = p.id === activePlayerObj.id;
                      return `
                        <button onclick="setActiveLivePlayer('${p.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                          isSel
                            ? 'bg-gradient-to-r from-cyan-600 to-purple-600 text-white'
                            : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                        }">
                          <span>${p.name}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : ''}

              <div class="text-xs text-zinc-400 px-1 flex items-center justify-between">
                <span>Spieler: <strong class="text-cyan-400">${activePlayerObj.name}</strong></span>
                <span>Punkte: <strong id="live-player-points" class="text-emerald-400">${(pStats.stunsBlinds + pStats.healsUnhooks) * 10}</strong></span>
              </div>

              <div class="grid grid-cols-2 gap-2.5">
                <button onclick="triggerDbdLiveEvent('missedCheck', '${activePlayerObj.id}')" class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+1 Shot</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white leading-tight">Skillcheck verfehlt</span>
                    <span id="live-count-missed" class="font-display font-bold text-2xl text-white">${pStats.missedChecks}</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('hook', '${activePlayerObj.id}')" class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">${pStats.hooks === 2 ? '3. = +3 Shots' : '+1 Shot'}</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white leading-tight">Am Haken</span>
                    <span id="live-count-hooks" class="font-display font-bold text-2xl text-white">${pStats.hooks}/3</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('stunBlind', '${activePlayerObj.id}')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+10 Pkt</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white leading-tight">Stun / Blind</span>
                    <span id="live-count-stun" class="font-display font-bold text-2xl text-white">${pStats.stunsBlinds}</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('healUnhook', '${activePlayerObj.id}')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+10 Pkt</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white leading-tight">Heal / Unhook</span>
                    <span id="live-count-heal" class="font-display font-bold text-2xl text-white">${pStats.healsUnhooks}</span>
                  </div>
                </button>
              </div>
            ` : `
              <div class="grid grid-cols-2 gap-2.5">
                <button onclick="triggerDbdLiveEvent('genRepaired')" class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+1 Shot</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white">Gen fertig</span>
                    <span id="killer-count-gens" class="font-display font-bold text-2xl text-white">${s.gensRepaired}/5</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('survHooked')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+5 Pkt</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white">Gehakt</span>
                    <span id="killer-count-hooks" class="font-display font-bold text-2xl text-white">${s.survivorsHooked}</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('survKilled')" class="glass-card hover:bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">+10 Pkt</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white">Gekillt</span>
                    <span id="killer-count-kills" class="font-display font-bold text-2xl text-white">${s.survivorsKilled}/4</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('killerStunned')" class="glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex flex-col justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+2 Shots</span>
                  <div class="flex items-end justify-between">
                    <span class="font-bold text-sm text-white">Stun / Blind</span>
                    <span id="killer-count-stun" class="font-display font-bold text-2xl text-white">${s.killerStunnedBlinded}</span>
                  </div>
                </button>

                <button onclick="triggerDbdLiveEvent('survEscaped')" class="col-span-2 glass-card hover:bg-rose-950/30 border border-rose-500/40 rounded-3xl p-3.5 text-left transition active:scale-95 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400">+1 Shot pro Survivor</span>
                    <h3 class="font-bold text-sm text-white">Entkommene Survivor</h3>
                  </div>
                  <span id="killer-count-escape" class="font-display font-bold text-2xl text-white">${s.survivorsEscaped}/4</span>
                </button>
              </div>
            `}

            ${state.lobby.role !== 'client' ? `
              <div class="pt-1">
                <button onclick="goToDbdReview()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-rose-600 text-white font-display font-bold text-base uppercase tracking-wider shadow-xl transition active:scale-95">
                  Runde vorbei – Auswertung
                </button>
              </div>
            ` : `
              <p class="text-center text-xs text-zinc-500 pt-1">Der Host beendet die Runde sobald das Match vorbei ist.</p>
            `}
          </div>
        `;
      }

      if (dbd.phase === 'review') {
        const s = dbd.liveStats;
        const actual = dbd.actualOutcome;
        const isRemoteClient = state.lobby.role === 'client';
        const myReviewId = isRemoteClient ? state.lobby.myPlayerId : (state.players[0]?.id || '');
        const isMyReviewReady = Boolean(dbd.reviewReadyPlayers[myReviewId]);
        const reviewParticipants = state.lobby.role !== 'offline'
          ? state.players.filter(p => p.id === myReviewId)
          : getDbdParticipants();

        return `
          <div class="animate-pop space-y-3">
            ${topBar}

            <div class="glass-card rounded-3xl p-4 sm:p-5 border border-amber-500/30 space-y-3.5">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-widest text-amber-400">Runden-Check</span>
                <h2 class="font-display font-bold text-2xl text-white uppercase">Eigene Stats & Auflösung</h2>
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1">Map</label>
                <select
                  onchange="state.dbd.actualOutcome.map = this.value"
                  class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                >
                  ${DBD_MAPS.map(m => `<option value="${m}" ${actual.map === m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
              </div>

              ${dbd.mode === 'survivor' ? `
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1">Killer</label>
                  <select
                    onchange="state.dbd.actualOutcome.killer = this.value"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    ${DBD_KILLERS.map(k => `<option value="${k}" ${actual.killer === k ? 'selected' : ''}>${k}</option>`).join('')}
                  </select>
                </div>

                <div class="space-y-2.5">
                  ${reviewParticipants.map(p => {
                    const pStats = ensureDbdPlayerStats(p.id);
                    return `
                      <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 space-y-2">
                        <div class="font-bold text-sm text-cyan-300 border-b border-zinc-800 pb-1.5">${p.name}</div>
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Skillchecks verfehlt</span>
                          <div class="flex items-center gap-2">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'missedChecks', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.missedChecks}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'missedChecks', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Male am Haken (0–3)</span>
                          <div class="flex items-center gap-2">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'hooks', -1, 0, 3)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.hooks}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'hooks', 1, 0, 3)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Stun / Blind</span>
                          <div class="flex items-center gap-2">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'stunsBlinds', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.stunsBlinds}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'stunsBlinds', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-zinc-300">Heal / Unhook</span>
                          <div class="flex items-center gap-2">
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'healsUnhooks', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                            <span class="font-bold w-6 text-center text-white">${pStats.healsUnhooks}</span>
                            <button onclick="adjustReviewPlayerStat('${p.id}', 'healsUnhooks', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : `
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-1">Exhaustion Perk</label>
                  <select
                    onchange="state.dbd.actualOutcome.exhaustionPerk = this.value"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    ${DBD_EXHAUSTION_PERKS.map(perk => `<option value="${perk.id}" ${actual.exhaustionPerk === perk.id ? 'selected' : ''}>${perk.name}</option>`).join('')}
                  </select>
                </div>

                <div class="space-y-2">
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl text-xs">
                    <span>Gens repariert (0–5)</span>
                    <div class="flex items-center gap-2.5">
                      <button onclick="adjustReviewGlobalStat('gensRepaired', -1, 0, 5)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                      <span class="font-bold w-6 text-center">${s.gensRepaired}</span>
                      <button onclick="adjustReviewGlobalStat('gensRepaired', 1, 0, 5)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl text-xs">
                    <span>Survivor angehakt</span>
                    <div class="flex items-center gap-2.5">
                      <button onclick="adjustReviewGlobalStat('survivorsHooked', -1, 0, 12)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                      <span class="font-bold w-6 text-center">${s.survivorsHooked}</span>
                      <button onclick="adjustReviewGlobalStat('survivorsHooked', 1, 0, 12)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl text-xs">
                    <span>Survivor gekillt (0–4)</span>
                    <div class="flex items-center gap-2.5">
                      <button onclick="adjustReviewGlobalStat('survivorsKilled', -1, 0, 4)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                      <span class="font-bold w-6 text-center">${s.survivorsKilled}</span>
                      <button onclick="adjustReviewGlobalStat('survivorsKilled', 1, 0, 4)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl text-xs">
                    <span>Stun / Blind kassiert</span>
                    <div class="flex items-center gap-2.5">
                      <button onclick="adjustReviewGlobalStat('killerStunnedBlinded', -1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                      <span class="font-bold w-6 text-center">${s.killerStunnedBlinded}</span>
                      <button onclick="adjustReviewGlobalStat('killerStunnedBlinded', 1, 0, 50)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl text-xs">
                    <span>Entkommene Survivor (0–4)</span>
                    <div class="flex items-center gap-2.5">
                      <button onclick="adjustReviewGlobalStat('survivorsEscaped', -1, 0, 4)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                      <span class="font-bold w-6 text-center">${s.survivorsEscaped}</span>
                      <button onclick="adjustReviewGlobalStat('survivorsEscaped', 1, 0, 4)" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">+</button>
                    </div>
                  </div>
                </div>
              `}

              ${isMyReviewReady ? `
                <div class="text-center bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-3.5">
                  <p class="text-xs text-emerald-300 font-bold">Ergebnis bestätigt! Leaderboard erscheint sobald alle fertig sind...</p>
                </div>
              ` : `
                <button onclick="confirmDbdReviewForPlayer('${myReviewId}')" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-600 text-white font-display font-bold text-base uppercase tracking-wider shadow-xl transition active:scale-95">
                  Ergebnis bestätigen
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (dbd.phase === 'leaderboard') {
        const results = dbd.results || [];
        const maxShots = results.reduce((max, r) => Math.max(max, r.shots), 0);
        const newRoundLabel = dbd.mode === 'killer' ? 'Neue Runde (Killer wechselt)' : 'Neue Runde';

        return `
          <div class="animate-pop space-y-3.5">
            ${topBar}

            <div class="glass-card rounded-3xl p-4 sm:p-5 border border-amber-500/30 text-center">
              <span class="text-[11px] font-bold uppercase tracking-widest text-amber-400">Runden-Auswertung</span>
              <h2 class="font-display font-bold text-3xl text-white uppercase mt-0.5">Leaderboard</h2>
            </div>

            <div class="space-y-3 pt-1">
              ${results.map((res, idx) => {
                const isTopDrinker = maxShots > 0 && res.shots === maxShots;
                const rankColor = idx === 0 ? 'from-amber-500 to-yellow-600 text-black' : idx === 1 ? 'from-zinc-300 to-zinc-500 text-black' : 'from-zinc-800 to-zinc-900 text-zinc-300';

                return `
                  <div class="relative glass-card rounded-3xl p-4 border ${idx === 0 ? 'border-amber-500/50' : 'border-zinc-800'}">
                    ${isTopDrinker ? `
                      <div class="sticker-badge absolute -top-3 -right-2 z-20 bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 text-zinc-950 font-display font-extrabold text-[11px] uppercase tracking-wider px-3 py-1 rounded-full shadow-lg border-2 border-zinc-950">
                        <span>Meiste Shots (${res.shots})</span>
                      </div>
                    ` : ''}

                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br ${rankColor} flex items-center justify-center font-display font-extrabold text-lg shrink-0">
                          #${idx + 1}
                        </div>
                        <div>
                          <h3 class="font-bold text-base text-white">${res.name}</h3>
                          <div class="flex items-center gap-3 mt-0.5">
                            <span class="text-xs font-bold text-emerald-400">${res.points} Punkte</span>
                            <span class="text-xs font-bold text-rose-400">${res.shots} ${res.shots === 1 ? 'Shot' : 'Shots'}</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="mt-2.5 pt-2 border-t border-zinc-800/80 space-y-1">
                      ${res.breakdown.map(line => `
                        <p class="text-[11px] text-zinc-400 leading-snug">• ${line}</p>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <button onclick="startSameModeNewRound(false)" class="py-3.5 px-2 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs uppercase tracking-wider shadow-lg transition active:scale-95">
                ${newRoundLabel}
              </button>
              <button onclick="resetDbdMatch('role', false)" class="py-3.5 px-2 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 font-bold text-xs uppercase tracking-wider transition active:scale-95">
                Rolle wechseln
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    // Initial Render
    render();
  </script>
</body>
</html>
